<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>매크로 지표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#070b10;--panel:#101722;--line:#1f2e42;--ink:#f1f5f9;--mute:#8c9eb5;--a:#33d1b6;--b:#f59e0b;--up:34,197,94;--dn:239,68,68}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:860px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:27px;margin:0;font-weight:700;letter-spacing:-.02em;color:#fff}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.upd{color:var(--mute);font-size:13px;margin:3px 0 0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#04070a}
.seg button{background:none;border:0;color:var(--mute);padding:7px 14px;font:inherit;cursor:pointer;transition:all .2s}
.seg button[aria-pressed=true]{background:var(--a);color:#070b10;font-weight:700;box-shadow:0 0 15px rgba(51,209,182,0.4)}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;transition:border-color .2s}
details.sec:hover{border-color:rgba(51,209,182,0.4)}
details.sec>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:14px}
details.sec>summary::-webkit-details-marker{display:none}
.st{font-size:18px;font-weight:700;min-width:64px;color:#fff}
.sm{flex:1;display:flex;flex-wrap:wrap;gap:2px 16px;font-size:13px;color:var(--mute)}
.sm b{color:var(--ink);font-size:15px;font-weight:700;margin-left:4px}
.arr{width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .2s;margin:-4px 4px 0 0}
details.sec[open] .arr{transform:rotate(-135deg);margin-top:4px}
.body{padding:2px 18px 14px}
.blk{border-top:1px solid var(--line);padding:16px 0 6px}
h3{font-size:14px;margin:0 0 8px;font-weight:600;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:4px 20px;margin-bottom:8px}
.chip{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--mute)}
.chip i{width:10px;height:3px;background:var(--a);align-self:center}
.chip.c1 i{background:var(--b)}
.chip b{font-size:21px;font-weight:700;color:var(--ink)}
.cv{position:relative;height:200px}
details.info{margin:8px 0 6px}
details.info summary{cursor:pointer;color:var(--a);font-size:13px;list-style:none}
details.info summary::-webkit-details-marker{display:none}
.exp{margin-top:8px;padding:12px 14px;background:#04070a;border-radius:10px;font-size:13.5px;color:var(--mute);border:1px solid var(--line)}
.exp p{margin:0 0 6px}.exp p:last-child{margin:0}.exp strong{color:var(--ink)}
.err{color:#ef4444}
.foot{color:var(--mute);font-size:12px;margin-top:20px}

main{max-width:860px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;margin:-8px 0 14px;background:var(--bg);backdrop-filter:blur(10px)}
.tabs button{flex:0 0 auto;background:var(--panel);color:var(--mute);border:1px solid var(--line);border-radius:14px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer;transition:all .2s}
.tabs button:hover{border-color:var(--a);color:var(--ink)}
.tabs button[aria-pressed=true]{background:var(--a);color:#070b10;border-color:var(--a);box-shadow:0 0 20px rgba(51,209,182,0.35)}
.view[hidden],.ctl[hidden],.subtabs[hidden]{display:none}
.subtabs{display:flex;gap:6px;margin:0 0 12px}
.subtabs button{background:none;color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:7px 16px;font:inherit;cursor:pointer;transition:all .2s}
.subtabs button:hover{color:var(--ink);border-color:var(--mute)}
.subtabs button[aria-pressed=true]{color:var(--a);border-color:var(--a);font-weight:700;background:rgba(51,209,182,0.08)}
.chip.c2 i{background:#c58bf2}.chip.c3 i{background:#e57a6f}.chip.c4 i{background:#7bd88f}
.fed table td.l{text-align:left}.fed .add{color:#22c55e}.fed .rem{color:#ef4444}.fed ul{margin:4px 0 8px;padding-left:18px;font-size:12.5px;color:var(--mute)}
.badge{display:inline-block;border-radius:8px;padding:0 8px;font-size:12px;border:1px solid var(--line);font-weight:700}
.badge.h{color:#f59e0b;border-color:rgba(245,158,11,0.4);background:rgba(245,158,11,0.08)}
.badge.d{color:#33d1b6;border-color:rgba(51,209,182,0.4);background:rgba(51,209,182,0.08)}
.fed .gauge{height:10px;background:#04070a;border-radius:5px;position:relative;margin:6px 0;border:1px solid var(--line)}.fed .gauge i{position:absolute;top:0;bottom:0;border-radius:5px}
.up{color:#22c55e;font-weight:600}.dn{color:#ef4444;font-weight:600}
table.us td.l{text-align:left;white-space:nowrap}table.us td.l span{display:block;font-size:11px;color:var(--mute);max-width:200px;overflow:hidden;text-overflow:ellipsis}
.srow{cursor:pointer;transition:background .15s}.srow:hover{background:rgba(51,209,182,0.04)}.crow .cv{height:250px;width:100%}.crow td{padding:10px 0;background:#04070a}
.tg{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;color:var(--b);background:rgba(245,158,11,0.06)}
.rbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.rbar button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer;transition:all .2s}
.rbar button:hover{border-color:var(--a);color:var(--a)}
.rbar button:disabled{opacity:.5;cursor:default}
#rst{font-size:12px;color:var(--mute)}
.cb .t{height:10px;background:#04070a;border-radius:5px;position:relative;overflow:hidden;min-width:90px;border:1px solid var(--line)}
.cb .f{position:absolute;top:0;bottom:0;border-radius:5px}
.lk{color:var(--a);text-decoration:none;margin-right:12px;white-space:nowrap}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
.links a{color:var(--a);text-decoration:none;font-size:13px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px;transition:all .2s}
.links a:hover{border-color:var(--a);background:rgba(51,209,182,0.06)}
</style>
<!-- TradingView Lightweight Charts 라이브러리 추가 -->
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<main>
<nav class="tabs" id="tabs"><button data-t="cycle" aria-pressed="true">경기 사이클</button><button data-t="macro" aria-pressed="false">매크로 지표</button><button data-t="comm" aria-pressed="false">원자재</button><button data-t="usm" aria-pressed="false">미국 증시</button><button data-t="krm" aria-pressed="false">한국 증시</button></nav>
<div class="rbar"><button id="rload">⟳ 다시 불러오기</button><button id="rbtn">⚡ 새로 수집</button><button id="rset" title="토큰 설정">⚙</button><span id="rst"></span></div>
<nav class="subtabs" id="subtabs" hidden><button data-t="sector" aria-pressed="true">섹터</button><button data-t="us" aria-pressed="false">테마 TOP10</button><button data-t="flow" aria-pressed="false">자금 흐름</button></nav>

<div class="ctl" id="gctl" style="margin:0 0 14px"><div class="seg"><button id="mab" aria-pressed="true">이동평균선</button></div><div class="seg" id="seg"><button data-r="1">1년</button><button data-r="3" aria-pressed="true">3년</button><button data-r="5">5년</button></div></div>
<section class="view" id="v-macro"><header>
  <div><h1>매크로 지표</h1><p class="upd" id="upd">불러오는 중…</p></div>
</header><div id="root"></div></section>

<section class="view" id="v-sector" hidden><h1>섹터</h1><p class="upd" id="supd">불러오는 중…</p><div id="sroot"></div></section>
<section class="view" id="v-comm" hidden><h1>원자재</h1><p class="upd" id="upd2">불러오는 중…</p><div id="croot2"></div></section>
<section class="view" id="v-us" hidden><h1>테마 TOP10</h1><p class="upd" id="upd4">불러오는 중…</p>
<div class="ctl"><div class="seg" id="usr"><button data-n="21" aria-pressed="false">1개월</button><button data-n="63" aria-pressed="true">3개월</button><button data-n="126" aria-pressed="false">6개월</button><button data-n="260" aria-pressed="false">1년</button></div></div>
<p class="sub" id="usnote"></p><div id="usroot"></div></section>
<section class="view" id="v-kflow" hidden><h1>한국 수급</h1><p class="upd" id="upd6">불러오는 중…</p>
<div class="ctl"><div class="seg" id="kfr"><button data-n="10" aria-pressed="false">10일</button><button data-n="20" aria-pressed="true">20일</button><button data-n="60" aria-pressed="false">60일</button></div></div>
<p class="sub" id="kfnote"></p><div id="kfroot"></div></section>
<section class="view" id="v-kth" hidden><h1>테마 TOP10</h1><p class="upd" id="upd5">불러오는 중…</p>
<div class="ctl"><div class="seg" id="krr"><button data-n="21" aria-pressed="false">1개월</button><button data-n="63" aria-pressed="true">3개월</button><button data-n="126" aria-pressed="false">6개월</button><button data-n="260" aria-pressed="false">1년</button></div></div>
<p class="sub" id="krnote"></p><div id="krroot"></div></section>
<section class="view" id="v-flow" hidden><h1>자금 흐름</h1><p class="upd" id="upd3">불러오는 중…</p><h2>자산군·섹터 자금 유입 추정</h2><div class="panel" id="fproxy"></div><h2>유동성·달러·머니마켓</h2><div id="froot"></div></section>
<p class="foot">※ 참고용 일반 정보이며 투자 권유가 아닙니다. 투자 판단과 책임은 본인에게 있습니다.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const SECTIONS=[
["금리",["us_rate","kr_rate"],[
 ["미국·한국 기준금리",["us_rate","kr_rate"],"",{d:"중앙은행이 정하는 정책금리입니다.",w:"회의 직후 발표",n:"금리가 오르면 긴축, 내리면 완화",s:"자산 배분 참고",c:"예상치 차이에 반응"}]]],
["국채 금리",["us10y","us30y","kr3y"],[
 ["미국 국채 10년·30년",["us10y","us30y"],"",{d:"국채 시장 수익률",n:"성장주에 영향",s:"장기금리 급등 주시",c:"수급 영향 있음"}]]],
["환율",["usdkrw","jpykrw","usdjpy"],[
 ["원/달러",["usdkrw"],"",{d:"달러 당 원화",n:"원화 약세 지표",s:"외국인 자금 유출 압력",c:"이벤트 직후 변동성 큼"}]]],
["물가",["cpi","ppi","pce"],[
 ["CPI · 근원 CPI",["cpi","core_cpi"],"",{d:"소비자물가 변동",w:"중순 발표",n:"근원물가 중요",s:"예상치 대비 서프라이즈 핵심",c:"전년 대비 기준"}]]],
["고용",["nfp","unemp"],[
 ["비농업 고용 증감",["nfp"],"bar",{d:"일자리 월간 증감",w:"첫째주 금요일",n:"고용 견조함 확인",s:"수정치 확인 필요",c:"오차 존재"}]]],
["소비",["retail"],[
 ["소매판매",["retail","core_retail"],"",{d:"소매 판매 지표",w:"중순 발표",n:"경기 확장 신호",s:"명목값임",c:"자동차 제외 등"}]]],
["성장",["gdp","gdpnow"],[
 ["GDP 성장률",["gdp","gdpnow"],"",{d:"실질 성장률",w:"분기별 발표",n:"경제 성장 속도",s:"속보치 역할",c:"추정치 오차"}],
 ["ISM 제조업 PMI",["pmi"],"",{d:"제조업 경기 선행지표",w:"매월 첫 영업일",n:"50 이상 확장, 미만 위축",s:"경기 사이클 판단 핵심",c:"체감 경기와 괴리 가능"},{l:[["ISM 공식 사이트","https://www.ismworld.org/"]]}]
]]
];

const SECTIONS2=[
["귀금속",["gold","silver"],[
 ["금·은",["gold","silver"],"",{d:"안전자산 및 산업용 금속",n:"실질금리와 반대",s:"위험회피 신호",c:"구조적 수요"},{y2:["silver"]}]]],
["산업금속",["copper","nickel"],[
 ["구리·니켈",["copper","nickel"],"",{d:"산업 경기 선행지표",n:"수요 반영",s:"괴리 발생 시 점검",c:"공급 요인"},{y2:["nickel"]}]]],
["에너지",["wti","brent","dubai","natgas"],[
 ["원유·천연가스",["wti","brent","dubai","natgas"],"",{d:"에너지 가격",n:"물가 부담",s:"지정학적 이슈",c:"감산 등 민감"},{y2:["natgas"]}]]]
];

const SECTIONS3=[
["연준 유동성",["net_liq"],[
 ["순유동성",["net_liq"],"",{d:"총자산-TGA-역레포",n:"위험자산 우호도",s:"지수 비교",c:"근사치 계산"}]]]
];

let D,range=3;const charts=[],opened=new Set();
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=(v,u)=>v.toLocaleString("ko-KR",{maximumFractionDigits:2})+(u==="%"?"%":" "+u);
const cutoff=()=>{const d=new Date();d.setFullYear(d.getFullYear()-range);return d.toISOString().slice(0,10)};

// 20일, 60일, 200일선 이동평균선 적용
const MAMODE={usdkrw:"d",jpykrw:"d",usdjpy:"d",nfp:"m3",unemp:"m3",kr3y:"d",gold:"d",silver:"d",copper:"d",wti:"d",brent:"d",dubai:"m3",nickel:"m3",natgas:"d",mu:"d",skh:"d",sec:"d",usd_idx:"d",net_liq:"w"};
const PAL=["#33d1b6","#f59e0b","#c58bf2","#ef4444","#22c55e"];
const MAS={
  d:[[20,"20일선","#f59e0b"],[60,"60일선","#c58bf2"],[200,"200일선","#33d1b6"]],
  m3:[[3,"3개월 평균","#f59e0b"]],
  w:[[4,"4주 평균","#f59e0b"],[13,"13주 평균","#c58bf2"]]
};
let showMA=true;
function ma(p,n){const o=[];let s=0;for(let i=0;i<p.length;i++){s+=p[i][1];if(i>=n)s-=p[i-n][1];if(i>=n-1)o.push([p[i][0],s/n])}return o}
const maOf=keys=>showMA&&keys.length===1?MAS[MAMODE[keys[0]]]:null;

function draw(cv,keys,type,opts={}){
  const co=cutoff(),labs=new Set(),ds=[];
  const hasY2 = opts.y2 && opts.y2.length > 0;
  keys.forEach((k,i)=>{const x=D.series[k];if(!x)return;
    const m=new Map(x.points.filter(p=>p[0]>=co));m.forEach((_,d)=>labs.add(d));
    const isY2 = hasY2 && opts.y2.includes(k);
    ds.push({label:x.name,m,color:PAL[i]||"#33d1b6",w:1.8,yAxisID:isY2?"y1":"y"});
    if(!isY2){
      (maOf(keys)||[]).forEach(([n,nm,c])=>ds.push({label:nm,m:new Map(ma(x.points,n).filter(p=>p[0]>=co)),color:c,w:1.3,line:1,yAxisID:"y"}));
    }
  });
  const L=[...labs].sort();
  charts.push(new Chart(cv,{type:type||"line",
    data:{labels:L,datasets:ds.map(d=>({...(d.line?{type:"line"}:{}),label:d.label,data:L.map(l=>d.m.has(l)?d.m.get(l):null),
      borderColor:d.color,backgroundColor:d.color,borderWidth:d.w,pointRadius:0,spanGaps:true,yAxisID:d.yAxisID}))},
    options:{maintainAspectRatio:false,animation:false,interaction:{mode:"index",intersect:false},
      plugins:{legend:{display:true,labels:{color:css("--mute"),boxWidth:12}}},
      scales:{x:{grid:{display:false},ticks:{maxTicksLimit:6,color:css("--mute")}},
              y:{type:"linear",display:true,position:"left",grid:{color:css("--line")},ticks:{color:css("--mute")}},
              ...(hasY2?{y1:{type:"linear",display:true,position:"right",grid:{display:false},ticks:{color:css("--mute")}}}:{})
      }}}));
}
const paint=(el,blocks)=>el.querySelectorAll("canvas").forEach(cv=>{const b=blocks[+cv.dataset.i];draw(cv,b[1],b[2],b[4]||{})});
const LAB=[["d","정의"],["w","발표 시기"],["n","핵심 포인트"],["s","투자 활용"],["c","주의할 점"]];

function mk(id,secs,opened){
  const root=document.getElementById(id);root.innerHTML="";
  secs.forEach(([sec,head,blocks],si)=>{
    const d=document.createElement("details");d.className="sec";d.open=opened.has(si);
    const sm=head.map(k=>{const x=D.series[k];if(!x)return"";const l=x.points[x.points.length-1];
      return`<span>${x.name}<b>${fmt(l[1],x.unit)}</b></span>`}).join("");
    d.innerHTML=`<summary><span class="st">${sec}</span><span class="sm">${sm||"<span>설명 전용</span>"}</span><span class="arr"></span></summary><div class="body">`
      +blocks.map(([title,keys,,info],bi)=>`<div class="blk"><h3>${title}</h3>${info.l?`<div class="links">${info.l.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t} ↗</a>`).join("")}</div>`:""}`
      +(keys.length?`<div class="chips">`+keys.map((k,i)=>{const x=D.series[k];if(!x)return`<span class="chip err">${k}: 수집 실패</span>`;
          const l=x.points[x.points.length-1];
          return`<span class="chip c${i}"><i></i>${x.name} <b>${fmt(l[1],x.unit)}</b> ${l[0]}</span>`}).join("")
        +(maOf(keys)||[]).map(([n,nm,c])=>`<span class="chip"><i style="background:${c}"></i>${nm}</span>`).join("")
        +`</div><div class="cv"><canvas data-i="${bi}"></canvas></div>`:"")
      +`<details class="info"><summary>ⓘ 지표 설명 보기</summary><div class="exp">`
      +LAB.map(([k,t])=>info[k]?`<p><strong>${t}</strong> ${info[k]}</p>`:"").join("")+`</div></details></div>`).join("")
      +`</div>`;
    d.addEventListener("toggle",e=>{if(e.target!==d)return;
      if(d.open){opened.add(si);paint(d,blocks)}else opened.delete(si)});
    root.appendChild(d);
    if(d.open)paint(d,blocks);
  });
}
const opened2=new Set(),opened3=new Set();
let EXD=null;
const tone=v=>v>0.25?["매파","h"]:v<-0.25?["비둘기","d"]:["중립",""];
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function gauge(v){const w=Math.min(50,Math.abs(v)*50),p=v>=0;return`<div class="gauge"><i style="left:${p?50:50-w}%;width:${w}%;background:${p?"#f59e0b":"#33d1b6"}"></i></div>`}
function renderFed(){const sec=document.querySelector("#root details.sec"),b=sec&&sec.querySelector(".body");if(!b)return;
  const old=b.querySelector(".fed");if(old)old.remove();
  const f=EXD&&EXD.fed;let h='<div class="blk fed"><h3>FOMC 성명·연준 발언과 뉘앙스</h3>';
  if(!f||!f.statements||!f.statements.length){h+='<p class="sub">'+(EXD?'연준 사이트에서 성명을 가져오지 못했습니다. '+(EXD.errors||[]).slice(0,3).map(esc).join(' / '):'아직 데이터가 없습니다. GitHub Actions에서 extra-update를 한 번 실행해 주세요.')+'</p></div>';b.insertAdjacentHTML("afterbegin",h);return}
  const L=f.statements[0],T=tone(L.score);
  h+=`<p><b>${L.date}</b> 최신 FOMC 성명 · 결정 <b>${L.decision}</b>${L.range?" · 목표범위 "+L.range+"%":""} · 뉘앙스 <span class="badge ${T[1]}">${T[0]} ${L.score>0?"+":""}${L.score}</span> <a class="lk" href="${L.url}" target="_blank" rel="noopener">원문 ↗</a></p>${gauge(L.score)}`;
  if((L.hawk||[]).length||(L.dove||[]).length)h+=`<p class="sub">근거 문구 — 매파: ${(L.hawk||[]).map(esc).join(", ")||"없음"} / 비둘기: ${(L.dove||[]).map(esc).join(", ")||"없음"}</p>`;
  if((L.added||[]).length||(L.removed||[]).length)h+=`<details class="info"><summary>ⓘ 직전 성명 대비 바뀐 문장</summary><div class="exp"><ul>${(L.added||[]).map(x=>`<li class="add">＋ ${esc(x)}</li>`).join("")}${(L.removed||[]).map(x=>`<li class="rem">－ ${esc(x)}</li>`).join("")}</ul></div></details>`;
  h+='<div class="wrap"><table><tr><th>날짜</th><th>결정</th><th>범위</th><th>뉘앙스</th></tr>'+f.statements.map(x=>{const t=tone(x.score);return`<tr><td>${x.date}</td><td>${x.decision}</td><td>${x.range||"-"}</td><td><span class="badge ${t[1]}">${t[0]} ${x.score>0?"+":""}${x.score}</span></td></tr>`}).join("")+'</table></div>';
  if((f.speeches||[]).length)h+='<h3 style="margin-top:14px">최근 연설·의회 증언</h3><div class="wrap"><table><tr><th>날짜</th><th>발언자</th><th class="l">제목</th><th>뉘앙스</th></tr>'+f.speeches.map(x=>{const t=tone(x.score);return`<tr><td>${x.date}</td><td>${esc(x.who)}</td><td class="l"><a class="lk" href="${x.url}" target="_blank" rel="noopener">${esc(x.title)}</a> <small>${x.kind}</small></td><td><span class="badge ${t[1]}">${t[0]}</span></td></tr>`}).join("")+'</table></div>';
  h+='<p class="sub" style="margin-top:8px">연준 공식 사이트의 영어 원문을 문구 사전(매파·비둘기 표현)으로 점수화한 근사치입니다. 실제 시장 해석과 다를 수 있고, 번역·요약은 하지 않습니다.</p>'+((EXD&&EXD.errors&&EXD.errors.length)?'<p class="sub">수집 중 일부 오류: '+EXD.errors.slice(0,4).map(esc).join(" / ")+'</p>':"")+'</div>';
  b.insertAdjacentHTML("afterbegin",h)}
function renderRates(){const sec=[...document.querySelectorAll("#root details.sec")].find(x=>x.querySelector(".st").textContent==="국채 금리"),b=sec&&sec.querySelector(".body");if(!b)return;
  const old=b.querySelector(".rt");if(old)old.remove();const f=EXD&&EXD.fed&&EXD.fed.statements&&EXD.fed.statements[0];
  const row=(nm,k)=>{const s=D.series[k];if(!s||s.points.length<2)return null;const p=s.points,l=p[p.length-1][1],pv=p[p.length-2][1],m=p[Math.max(0,p.length-22)][1];return{nm,l,d1:(l-pv)*100,d1m:(l-m)*100,dt:p[p.length-1][0]}};
  const ef=row("실효 연방기금금리(EFFR)","effr"),rows=[["6개월물","tb6m"],["1년물","us1y"],["2년물","us2y"],["10년물","us10y"],["30년물","us30y"]].map(a=>row(a[0],a[1])).filter(Boolean),base=ef?ef.l:null;
  const bp=v=>(v>0?"+":"")+v.toFixed(0)+"bp",c=v=>v>=0?"up":"dn";
  let h='<div class="blk rt"><h3>미국 기준금리와 국채 금리 한눈에</h3><div class="wrap"><table><tr><th></th><th>금리(%)</th><th>기준금리 대비</th><th>전일</th><th>1개월</th></tr>';
  if(f&&f.range)h+=`<tr><td><b>기준금리 (FOMC 목표범위)</b><br><small>${f.date} ${f.decision}</small></td><td colspan="4"><b>${f.range}%</b></td></tr>`;
  h+=[ef,...rows].filter(Boolean).map(r=>`<tr><td>${r.nm}<br><small>${r.dt}</small></td><td><b>${r.l.toFixed(2)}</b></td><td class="${base==null||r===ef?"":c(r.l-base)}">${base==null||r===ef?"-":bp((r.l-base)*100)}</td><td class="${c(r.d1)}">${bp(r.d1)}</td><td class="${c(r.d1m)}">${bp(r.d1m)}</td></tr>`).join("");
  h+='</table></div><p class="sub">기준금리 대비는 실효 연방기금금리(EFFR)와의 차이입니다. 목표범위는 최신 FOMC 성명 기준입니다. 1개월은 약 21거래일 전과 비교합니다.</p></div>';
  b.insertAdjacentHTML("afterbegin",h)}
function build(){charts.splice(0).forEach(c=>c.destroy());mk("root",SECTIONS,opened);mk("croot2",SECTIONS2,opened2);mk("froot",SECTIONS3,opened3);renderFed();renderRates()}
function renderProxy(m){const el=document.getElementById("fproxy");
  if(!m||!m.proxy||!m.proxy.length){el.innerHTML='<p class="sub">ETF 자금 흐름 데이터가 아직 없습니다. GitHub Actions에서 market-update를 한 번 실행해 주세요.</p>';return}
  const G=[...new Set(m.proxy.map(x=>x.g))];
  el.innerHTML=G.map(g=>`<div class="blk"><h3>${g}</h3><table><tr><th></th><th>자금 흐름(CMF)</th><th></th><th>거래대금</th><th>20일</th></tr>`
    +m.proxy.filter(x=>x.g===g).sort((a,b)=>b.cmf-a.cmf).map(x=>{const w=Math.min(50,Math.abs(x.cmf)/0.4*50),p=x.cmf>=0;
      return`<tr><td>${x.n} · ${x.t}</td><td class="cb"><div class="t"><div class="f" style="left:${p?50:50-w}%;width:${w}%;background:${p?"var(--a)":"#ef4444"}"></div></div></td><td>${p?"+":""}${x.cmf.toFixed(2)}</td><td>${x.dv.toFixed(2)}배</td><td>${x.r20>0?"+":""}${x.r20.toFixed(1)}%</td></tr>`}).join("")+`</table></div>`).join("")
    +`<details class="info"><summary>ⓘ 이 표는?</summary><div class="exp"><p><strong>의미</strong> 자금이 실제로 얼마 들어오고 나갔는지 직접 재는 것이 아니라, 가격과 거래량으로 추정한 값입니다. CMF(Chaikin 자금 흐름)는 최근 20거래일 동안 종가가 하루 가격 범위의 위쪽에서 마감하며 거래가 늘었는지(+), 아래쪽이었는지(−)를 −1~+1로 나타냅니다.</p><p><strong>읽는 법</strong> 거래대금 배율은 최근 5일 평균 거래대금을 60일 평균과 비교한 값으로, 1보다 크면 거래가 평소보다 활발합니다. 가격이 오르는데 CMF가 낮으면 상승에 힘이 약하다는 신호로 참고합니다.</p><p><strong>주의할 점</strong> 단기 거래 흐름의 추정치이며 실제 순유입 자금(펀드 설정·환매)과 다를 수 있습니다.</p></div></details>`}

const jf=u=>fetch(u+"?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()});
let SIG="";

  D=d;D.series=Object.assign({},d.series,m?m.series:{},x?x.series:{});EXD=x;SIG=d.updated+"|"+(m?m.updated:"");
  document.getElementById("upd").textContent="마지막 갱신 "+d.updated+" (한국시간)";
  const t=m?"마지막 갱신 "+m.updated+" (한국시간)":"아직 데이터가 없습니다. GitHub Actions에서 market-update를 한 번 실행해 주세요.";

}).catch(()=>{document.getElementById("upd").textContent="데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요."})}
load();
const REPO="efiltsew-cmd/Economic_macro_site",TK="gh_refresh_token",POLL=15000;
const say=t=>{document.getElementById("rst").textContent=t};
const gt=()=>{try{return localStorage.getItem(TK)||""}catch(e){return ""}};
document.getElementById("rset").addEventListener("click",()=>{
  if(gt()&&confirm("저장된 토큰을 삭제할까요?")){localStorage.removeItem(TK);say("토큰을 삭제했습니다.");return}
  const t=prompt("GitHub 토큰(github_pat_...)을 붙여넣으세요. 이 기기의 브라우저에만 저장됩니다.");
  if(t&&t.trim()){localStorage.setItem(TK,t.trim());say("토큰을 저장했습니다. ↻ 버튼을 눌러 주세요.")}});
document.getElementById("rload").addEventListener("click",async()=>{say("불러오는 중…");await load();if(window.__loadC)window.__loadC();if(window.__loadU)await window.__loadU();if(window.__loadK)await window.__loadK();if(window.__loadF)await window.__loadF();say("저장된 최신 데이터를 불러왔습니다"+(D?" ("+D.updated+")":""))});
let busy=false;
document.getElementById("rbtn").addEventListener("click",async()=>{
  if(busy)return;
  let t=gt();if(!t){if(!confirm("새로 수집하려면 GitHub 토큰이 필요합니다. 지금 설정할까요? (취소하면 아무 일도 일어나지 않습니다)"))return;document.getElementById("rset").click();t=gt();if(!t)return}
  busy=true;document.getElementById("rbtn").disabled=true;say("갱신을 요청하는 중…");
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/refresh.yml/dispatches`,{method:"POST",headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:JSON.stringify({ref:"main"})});
    if(r.status!==204){say(r.status===401||r.status===403?"토큰이 거부되었습니다. ⚙에서 토큰을 다시 설정하세요.":r.status===404?"refresh.yml을 찾을 수 없습니다. 파일 위치와 토큰 권한을 확인하세요.":"요청 실패("+r.status+")");return}
    fetch(`https://api.github.com/repos/${REPO}/actions/workflows/us.yml/dispatches`,{method:"POST",headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:JSON.stringify({ref:"main"})}).catch(()=>{});
    fetch(`https://api.github.com/repos/${REPO}/actions/workflows/extra.yml/dispatches`,{method:"POST",headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:JSON.stringify({ref:"main"})}).catch(()=>{});
    fetch(`https://api.github.com/repos/${REPO}/actions/workflows/kr.yml/dispatches`,{method:"POST",headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:JSON.stringify({ref:"main"})}).catch(()=>{});
    const before=SIG,beforeU=window.__USIG||"",t0=Date.now();
    while(Date.now()-t0<9*60000){
      say("갱신 중… "+Math.round((Date.now()-t0)/1000)+"초 (보통 2~4분)");
      await new Promise(s=>setTimeout(s,POLL));
      const [a,b]=await Promise.all([jf("data.json").catch(()=>null),jf("market.json").catch(()=>null)]);
      if(a&&a.updated+"|"+(b?b.updated:"")!==before){await load();if(window.__loadC)window.__loadC();
        for(let i=0;i<12;i++){const u=await jf("us.json").catch(()=>null);if(u&&u.updated!==beforeU){if(window.__loadU)await window.__loadU();if(window.__loadK)await window.__loadK();if(window.__loadF)await window.__loadF();break}await new Promise(s=>setTimeout(s,POLL))}
        say("갱신 완료 ("+a.updated+")");return}
    }
    say("시간이 오래 걸리고 있습니다. 잠시 후 새로고침해 보세요.");
  }catch(e){say("요청 실패: 네트워크를 확인하세요.")}
  finally{busy=false;document.getElementById("rbtn").disabled=false}
});
</script>

<!-- 원래 파일의 완벽한 피델리티 경기 사이클 렌더링 로직 복원 -->
<script>(()=>{
const SYM={2:"++",1:"+",0:"","-1":"−","-2":"−−"};
const PER=[["d1","1일",3],["w1","1주",5],["m1","1개월",8],["m3","3개월",12],["m6","6개월",20]];
const DESC=[["초기","침체에서 급격히 회복하며 성장이 가속되는 국면"],["중간","가장 길고 완만하게 성장하는 국면"],["후기","성장은 플러스지만 둔화되고 과열 우려가 커지는 국면"],["침체","경제활동이 위축되고 이익이 줄며 신용이 경색되는 국면"]];
let D,per="m3";
const col=(v,mx)=>{const a=Math.min(1,Math.abs(v)/mx);return`rgba(${v>=0?"var(--up)":"var(--dn)"},${(.18+.7*a).toFixed(2)})`};
const sg=(v,d=1)=>(v>0?"+":"")+v.toFixed(d)+"%";
function bars(sc,best,signed){
  const mx=signed?Math.max(1,...sc.map(Math.abs)):100;
  return sc.map((v,i)=>{
    const w=Math.abs(v)/mx*(signed?50:100);
    const st=signed?`left:${v>=0?50:50-w}%;width:${w}%;background:${v>=0?"var(--a)":"#ef4444"}`:`left:0;width:${w}%;background:var(--a)`;
    return`<div class="bar${i===best?" best":""}"><span>${DESC[i][0]}</span><div class="t"><div class="f" style="${st}"></div></div><b>${signed?v.toFixed(2):v+"%"}</b></div>`}).join("");
}
function html(D,per){
  const E=D.econ,M=D.market,pi=PER.find(p=>p[0]===per);
  const verdict=E.best===M.best
    ?`경제 지표와 섹터 흐름이 모두 <b>${DESC[E.best][0]} 국면</b>을 가리킵니다.`
    :`경제 지표는 <b>${DESC[E.best][0]} 국면</b>, 섹터 흐름은 <b>${DESC[M.best][0]} 국면</b>에 가깝습니다. 두 신호가 엇갈리면 국면 전환기일 수도 있지만, 단정하지 말고 추이를 지켜보세요.`;
  const sec=[...D.sectors].sort((a,b)=>b.ret[per]-a.ret[per]);
  return`<h2>현재 위치</h2><div class="two">
<div class="panel"><h3>경제 지표 기준</h3><p class="sub">5개 지표가 가리키는 국면 득표율</p>${bars(E.scores,E.best,false)}</div>
<div class="panel"><h3>섹터 흐름 기준</h3><p class="sub">최근 섹터 강약이 피델리티 국면별 패턴과 맞는 정도 (−1~+1)</p>${bars(M.scores,M.best,true)}</div></div>
<div class="verdict">${verdict}</div>
<h2>판단 근거</h2><div class="panel wrap"><table class="ind"><tr><th>지표</th><th>현재</th><th>시사</th><th>기준</th></tr>`
+E.ind.map(x=>`<tr><td>${x.name}</td><td>${x.val}</td><td><span class="pill">${DESC[x.v][0]}</span></td><td>${x.why}</td></tr>`).join("")
+`</table></div>
<h2>섹터 히트맵</h2><div class="seg" id="per">${PER.map(p=>`<button data-p="${p[0]}" aria-pressed="${p[0]===per}">${p[1]}</button>`).join("")}</div>
<div class="heat">${sec.map(s=>`<div class="tile" style="background:${col(s.ret[per],pi[2])}"><span>${s.name} ·${s.etf}</span><b>${sg(s.ret[per])}</b><small>S&amp;P500 대비 3개월 ${sg(s.rel.m3)}</small></div>`).join("")}</div>
<h2>피델리티 국면별 섹터 패턴</h2><div class="panel wrap"><table><tr><th></th>`
+DESC.map((d,i)=>`<th>${d[0]}<br>${E.best===i?'<span class="tag e">경제</span>':""}${M.best===i?'<span class="tag m">섹터</span>':""}</th>`).join("")
+`<th>3개월 상대</th><th>6개월 상대</th></tr>`
+D.sectors.map(s=>`<tr><td>${s.name}</td>`+s.w.map(w=>`<td style="background:${w===0?"transparent":col(w,2.4)}">${SYM[w]}</td>`).join("")+`<td>${sg(s.rel.m3)}</td><td>${sg(s.rel.m6)}</td></tr>`).join("")
+`</table><p class="sub" style="margin-top:10px">++ / + : 해당 국면에서 시장보다 높은 수익률 확률이 매우 높음 / 높음 · −− / − : 낮은 확률 · 빈칸: 뚜렷한 상관 없음. 상대 수익률은 S&amp;P500(SPY) 대비 %p입니다.</p></div>
<h2>국면 설명</h2><div class="panel legend">${DESC.map(d=>`<p><strong>${d[0]}</strong>${d[1]}</p>`).join("")}</div>`;
}
function show(){
  const full=html(D,per),i=full.indexOf('<h2>섹터 히트맵</h2>'),j=full.indexOf('<h2>국면 설명</h2>');
  document.getElementById("croot").innerHTML=full.slice(0,i)+full.slice(j)+'<p class="foot">※ 규칙으로 계산한 근사치이며 피델리티의 공식 판단이 아닙니다. 과거 패턴이 반복된다는 보장은 없습니다.</p>';
  document.getElementById("sroot").innerHTML='<div class="links"><a href="https://finviz.com/map.ashx" target="_blank" rel="noopener">Finviz 히트맵 ↗</a><a href="https://finviz.com/groups.ashx" target="_blank" rel="noopener">Finviz 섹터·업종 성과 ↗</a></div><p class="sub">SPDR 섹터 ETF 기준 · 배당 포함(총수익률)입니다. Finviz 같은 가격 수익률과는 몇 %p 다를 수 있습니다.</p>'+full.slice(i,j);
  document.getElementById("per").addEventListener("click",e=>{if(e.target.dataset.p){per=e.target.dataset.p;show()}});
}
window.__loadC=()=>fetch("cycle.json?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{

<script>(()=>{
function stockTab(C){
const $=id=>document.getElementById(id);let U,rng=63,ma=true;const ch={};
const sg=(v,d=2)=>v==null?"-":(v>0?"+":"")+v.toFixed(d)+"%",cl=v=>v==null?"":v>=0?"up":"dn",px=v=>v==null?"-":v.toLocaleString("en-US",{minimumFractionDigits:C.dec,maximumFractionDigits:C.dec});

// Lightweight Charts 캔들 차트 연동
function renderCandle(container, rawData){
  container.innerHTML = "";
  if(!rawData || !rawData.length) { container.innerHTML = "<p class='sub'>차트 데이터가 없습니다.</p>"; return; }
  const chart = LightweightCharts.createChart(container, {
    layout: { background: { type: 'solid', color: '#04070a' }, textColor: '#8c9eb5' },
    grid: { vertLines: { color: '#1f2e42' }, horzLines: { color: '#1f2e42' } },
    timeScale: { borderColor: '#1f2e42' },
    rightPriceScale: { borderColor: '#1f2e42' }
  });
  const candleSeries = chart.addCandlestickSeries({
    upColor: '#22c55e', downColor: '#ef4444',
    borderUpColor: '#22c55e', borderDownColor: '#ef4444',
    wickUpColor: '#22c55e', wickDownColor: '#ef4444',
  });
  const formatted = rawData.map(item => {
    if(typeof item === 'object' && item !== null && item.open !== undefined) {
      return { time: item.time, open: item.open, high: item.high, low: item.low, close: item.close };
    } else {
      let val = Array.isArray(item) ? item[1] : item;
      let timeStr = Array.isArray(item) ? item[0] : "";
      return { time: timeStr, open: val, high: val, low: val, close: val };
    }
  }).filter(x => x.time);
  candleSeries.setData(formatted);
  chart.timeScale().fitContent();
  return chart;
}

const row=(x,e)=>`<tr class="srow" data-t="${x.t}"><td class="l">${C.lab(x,e)}</td><td>${px(x.close)}</td><td class="${cl(x.chg)}">${sg(x.chg)}</td><td class="${cl(x.r5)}">${sg(x.r5,1)}</td><td class="${cl(x.r1m)}">${sg(x.r1m,1)}</td><td class="${cl(x.r3m)}">${sg(x.r3m,1)}</td></tr><tr class="crow" hidden><td colspan="6"><div class="cv"></div></td></tr>`;
function show(open){Object.values(ch).forEach(c => { if(c && typeof c.remove === 'function') c.remove(); });Object.keys(ch).forEach(k=>delete ch[k]);
  const S=[...U.sectors].sort((a,b)=>(b.etf_row.chg??-99)-(a.etf_row.chg??-99));
  $(C.root).innerHTML=S.map((s,i)=>`<details class="sec" data-e="${s.etf}" ${open.has(s.etf)?"open":""}><summary><span class="st">${s.name}</span><span class="sm"><span>${s.etf}<b>${px(s.etf_row.close)}</b></span><span class="${cl(s.etf_row.chg)}"><b>${sg(s.etf_row.chg)}</b></span></span><span class="arr"></span></summary><div class="body"><div class="wrap"><table class="us"><tr><th></th><th>종가(${C.cur})</th><th>전일</th><th>5일</th><th>1개월</th><th>3개월</th></tr>${row(s.etf_row,1)}${s.stocks.map(x=>row(x)).join("")}</table></div><p class="sub">${C.sub}</p></div></details>`).join("");
  $(C.note).textContent=C.nt(U);}
function openSet(){return new Set([...document.querySelectorAll("#"+C.root+" details[open]")].map(d=>d.dataset.e))}
$(C.root).addEventListener("click",e=>{const r=e.target.closest(".srow");if(!r)return;const c=r.nextElementSibling,t=r.dataset.t;
  if(c.hidden){
    c.hidden=false;
    const div=c.querySelector(".cv");
    if(U.px && U.px[t]){ ch[t] = renderCandle(div, U.px[t]); }
  }else{
    c.hidden=true;
    if(ch[t]){ ch[t].remove(); delete ch[t]; }
  }
});
window[C.loader]=()=>fetch(C.json+"?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{U=d;window[C.sig]=d.updated;$(C.upd).textContent="마지막 갱신 "+d.updated+" (한국시간)";show(openSet())}).catch(()=>{$(C.upd).textContent="아직 데이터가 없습니다."});
window[C.loader]();
}
stockTab({root:"usroot",note:"usnote",range:"usr",ma:"usma",upd:"upd4",json:"us.json",loader:"__loadU",sig:"__USIG",dec:2,cur:"$",lab:(x,e)=>`<b>${x.t}</b>${e?' <span class="tg">ETF</span>':""}<span>${x.n||""}</span>`,nt:U=>"기준일 "+U.asof+" (미국 장마감) · 캔들 차트",sub:"ETF 보유 비중 상위 10종목 · 행을 누르면 캔들 차트가 열립니다."});
stockTab({root:"krroot",note:"krnote",range:"krr",ma:"krma",upd:"upd5",json:"krtheme.json",loader:"__loadK",sig:"__KSIG",dec:0,cur:"원",lab:(x,e)=>e?`<b>${x.n}</b> <span class="tg">평균</span>`:`<b>${x.n}</b><span>${x.t} · 거래대금 ${x.tv==null?"-":Math.round(x.tv).toLocaleString("ko-KR")}억</span>`,nt:U=>"기준일 "+U.asof+" (한국 장마감) · 캔들 차트",sub:"거래대금 상위 10종목 · 행을 누르면 캔들 차트가 열립니다."});
})();</script>

<script>(()=>{
const $=id=>document.getElementById(id);let F,n=20;const cs=[];
const COL={"개인":"#f59e0b","외국인":"#33d1b6","기관":"#c58bf2","차익":"#f59e0b","비차익":"#33d1b6","전체":"#c58bf2"};
const fn=v=>v==null?"-":(v>0?"+":"")+Math.round(v).toLocaleString("ko-KR"),cum=a=>{let s=0;return a.map(v=>v==null?null:(s+=v))};
function chart(cv,type,L,names,src){cs.push(new Chart(cv,{type,data:{labels:L,datasets:names.map(k=>({label:k,data:src[k],backgroundColor:COL[k],borderColor:COL[k],borderWidth:type==="line"?1.8:0,pointRadius:0,spanGaps:true}))},options:{maintainAspectRatio:false,animation:false,interaction:{mode:"index",intersect:false},plugins:{legend:{display:true,labels:{color:"#8c9eb5",boxWidth:10}}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:6,color:"#8c9eb5"}},y:{grid:{color:"#1f2e42"},ticks:{color:"#8c9eb5"}}}}}))}
function show(){cs.splice(0).forEach(c=>c.destroy());const root=$("kfroot");root.innerHTML="";const k0=F.kospi||F.kosdaq;
  if(!k0){$("kfnote").textContent="수급 데이터를 가져오지 못했습니다.";return}
  [["kospi","코스피"],["kosdaq","코스닥"]].forEach(([k,nm])=>{const m=F[k];if(!m)return;
    const L=m.dates.slice(-n),s=a=>a.slice(-n),last=a=>a[a.length-1],has=m["전체"]&&m["전체"].some(v=>v!=null);
    const d=document.createElement("details");d.className="sec";d.open=true;
    d.innerHTML=`<summary><span class="st">${nm}</span><span class="sm">${["개인","외국인","기관"].map(x=>`<span>${x}<b class="${last(m[x])>=0?"up":"dn"}">${fn(last(m[x]))}억</b></span>`).join("")}</span><span class="arr"></span></summary><div class="body"><div class="blk"><h3>일별 순매수 (억원)</h3><div class="cv"><canvas></canvas></div></div><div class="blk"><h3>누적 순매수 (최근 ${L.length}거래일, 억원)</h3><div class="cv"><canvas></canvas></div></div>${has?'<div class="blk"><h3>프로그램 매매 순매수 (억원)</h3><div class="cv"><canvas></canvas></div></div>':''}</div>`;
    root.appendChild(d);const cv=d.querySelectorAll("canvas"),dd={},cc={};
    ["개인","외국인","기관","차익","비차익","전체"].forEach(x=>{dd[x]=s(m[x]);cc[x]=cum(dd[x])});
    chart(cv[0],"bar",L,["개인","외국인","기관"],dd);chart(cv[1],"line",L,["개인","외국인","기관"],cc);if(has)chart(cv[2],"bar",L,["차익","비차익","전체"],dd)});
  $("kfnote").textContent="기준일 "+k0.dates.slice(-1)[0]+" · 출처: 네이버 금융 수급 자료"}
$("kfr").addEventListener("click",e=>{const v=e.target.dataset.n;if(!v)return;n=+v;document.querySelectorAll("#kfr button").forEach(b=>b.setAttribute("aria-pressed",b===e.target));if(F)show()});
window.__loadF=()=>fetch("krflow.json?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{F=d;$("upd6").textContent="마지막 갱신 "+d.updated+" (한국시간)";show()}).catch(()=>{$("upd6").textContent="아직 데이터가 없습니다."});
window.__loadF();
})();</script>

<script>(const top=[...document.querySelectorAll("#tabs button")],subs=[...document.querySelectorAll(".subtabs button")],V=["macro","cycle","sector","us","comm","flow","kflow","kth"],G={usm:["sector","us","flow"],krm:["kflow","kth"]},SU={usm:"subtabs",krm:"subtabs2"},last={usm:"sector",krm:"kflow"};
