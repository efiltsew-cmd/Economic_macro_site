<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>매크로 지표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 3번 스타일: 소프트 네온 카드 & 부드러운 인터랙션 컨셉 */
:root{
  --bg:#070b10;
  --panel:#101722;
  --panel-hover:#162030;
  --line:#1f2e42;
  --line-focus:#33d1b6;
  --ink:#f1f5f9;
  --mute:#8c9eb5;
  --a:#33d1b6;
  --b:#f59e0b;
  --up:34,197,94;
  --dn:239,68,68;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:860px;margin:0 auto;padding:32px 18px 72px}
h1{font-size:28px;margin:0;font-weight:700;letter-spacing:-.03em;color:#fff}
.upd{color:var(--mute);font-size:13px;margin:4px 0 6px}
.nav a{color:var(--a);font-size:13px;text-decoration:none;transition:opacity .2s}
.nav a:hover{opacity:.8}
h2{font-size:19px;margin:32px 0 12px;font-weight:700;color:#fff}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:0 10px 30px rgba(0,0,0,0.3);transition:transform .2s, border-color .2s, box-shadow .2s}
.panel:hover{border-color:rgba(51,209,182,0.3);box-shadow:0 10px 35px rgba(51,209,182,0.06)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:620px){.two{grid-template-columns:1fr}}
.panel h3{font-size:14px;margin:0 0 4px;font-weight:700;color:var(--mute)}
.sub{color:var(--mute);font-size:12px;margin:0 0 12px}

.bar{display:grid;grid-template-columns:44px 1fr 52px;gap:10px;align-items:center;font-size:13px;margin:8px 0}
.bar .t{height:10px;background:#04070a;border-radius:6px;position:relative;overflow:hidden;border:1px solid var(--line)}
.bar .f{position:absolute;top:0;bottom:0;border-radius:5px}
.bar.best{font-weight:700}
.bar.best b{color:var(--a)}

.verdict{margin-top:16px;padding:16px 18px;border-radius:14px;background:linear-gradient(135deg, rgba(16,33,43,0.8), rgba(15,42,48,0.9));border:1px solid rgba(51,209,182,0.3);font-size:14.5px;box-shadow:0 4px 20px rgba(51,209,182,0.08)}

.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:max-content;margin-bottom:12px;background:#04070a}
.seg button{background:none;border:0;color:var(--mute);padding:7px 14px;font:inherit;cursor:pointer;transition:all .2s}
.seg button[aria-pressed=true]{background:var(--a);color:#070b10;font-weight:700;box-shadow:0 0 15px rgba(51,209,182,0.4)}

.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}
.tile{border-radius:14px;padding:12px 14px;min-height:80px;border:1px solid rgba(255,255,255,0.04);transition:transform .2s}
.tile:hover{transform:translateY(-2px)}
.tile b{display:block;font-size:21px;font-weight:700}.tile span{font-size:12px;color:#f1f5f9}
.tile small{display:block;font-size:11px;opacity:.8}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500;vertical-align:bottom}

.tag{display:inline-block;font-size:10px;border-radius:6px;padding:2px 6px;margin:0 2px;color:#070b10;font-weight:700}
.tag.e{background:var(--b)}.tag.m{background:var(--a)}
.wrap{overflow-x:auto}
.ind td:last-child{text-align:left;color:var(--mute);font-size:12px}
.pill{display:inline-block;border-radius:8px;padding:2px 10px;background:var(--line);color:#fff}
.legend p{margin:6px 0;font-size:13.5px;color:var(--mute)}.legend strong{color:var(--ink)}
.foot{color:var(--mute);font-size:12px;margin-top:28px}

.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:12px 0 14px;margin:-8px 0 16px;background:var(--bg);backdrop-filter:blur(10px)}
.tabs button{flex:0 0 auto;background:var(--panel);color:var(--mute);border:1px solid var(--line);border-radius:14px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer;transition:all .2s}
.tabs button:hover{border-color:var(--a);color:var(--ink)}
.tabs button[aria-pressed=true]{background:var(--a);color:#070b10;border-color:var(--a);box-shadow:0 0 20px rgba(51,209,182,0.35)}

.view[hidden],.ctl[hidden],.subtabs[hidden]{display:none}
.subtabs{display:flex;gap:6px;margin:0 0 14px}
.subtabs button{background:none;color:var(--mute);border:1px solid var(--line);border-radius:12px;padding:8px 16px;font:inherit;cursor:pointer;transition:all .2s}
.subtabs button:hover{color:var(--ink);border-color:var(--mute)}
.subtabs button[aria-pressed=true]{color:var(--a);border-color:var(--a);font-weight:700;background:rgba(51,209,182,0.08)}

.chip.c2 i{background:#c58bf2}.chip.c3 i{background:#e57a6f}.chip.c4 i{background:#7bd88f}
.fed table td.l{text-align:left}.fed .add{color:#22c55e}.fed .rem{color:#ef4444}.fed ul{margin:4px 0 8px;padding-left:18px;font-size:12.5px;color:var(--mute)}
.badge{display:inline-block;border-radius:8px;padding:2px 10px;font-size:12px;border:1px solid var(--line);font-weight:700}
.badge.h{color:#f59e0b;border-color:rgba(245,158,11,0.4);background:rgba(245,158,11,0.08)}
.badge.d{color:#33d1b6;border-color:rgba(51,209,182,0.4);background:rgba(51,209,182,0.08)}

.up{color:#22c55e;font-weight:600}.dn{color:#ef4444;font-weight:600}
table.us td.l{text-align:left;white-space:nowrap}table.us td.l span{display:block;font-size:11px;color:var(--mute);max-width:200px;overflow:hidden;text-overflow:ellipsis}

details.sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden;transition:border-color .2s, box-shadow .2s}
details.sec:hover{border-color:rgba(51,209,182,0.4);box-shadow:0 4px 25px rgba(51,209,182,0.07)}
details.sec>summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;align-items:center;gap:14px}
details.sec>summary::-webkit-details-marker{display:none}
.st{font-size:18px;font-weight:700;min-width:70px;color:#fff}
.sm{flex:1;display:flex;flex-wrap:wrap;gap:2px 18px;font-size:13px;color:var(--mute)}
.sm b{color:var(--ink);font-size:15px;font-weight:700;margin-left:4px}
.arr{width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .2s;margin:-4px 4px 0 0}
details.sec[open] .arr{transform:rotate(-135deg);margin-top:4px}
.body{padding:4px 20px 18px}
.blk{border-top:1px solid var(--line);padding:18px 0 8px}
h3{font-size:14px;margin:0 0 10px;font-weight:600;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px 22px;margin-bottom:10px}
.chip{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--mute)}
.chip i{width:10px;height:3px;background:var(--a);align-self:center;border-radius:2px}
.chip.c1 i{background:var(--b)}
.chip b{font-size:21px;font-weight:700;color:var(--ink)}
.cv{position:relative;height:200px}
details.info{margin:10px 0 6px}
details.info summary{cursor:pointer;color:var(--a);font-size:13px;list-style:none}
details.info summary::-webkit-details-marker{display:none}
.exp{margin-top:10px;padding:14px 16px;background:#04070a;border-radius:12px;font-size:13.5px;color:var(--mute);border:1px solid var(--line)}
.exp p{margin:0 0 6px}.exp p:last-child{margin:0}.exp strong{color:var(--ink)}
.err{color:#ef4444}

.srow{cursor:pointer;transition:background .15s}.srow:hover{background:rgba(51,209,182,0.04)}.crow .cv{height:250px;width:100%}.crow td{padding:10px 0;background:#04070a}
.tg{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin-left:6px;color:var(--b);background:rgba(245,158,11,0.06)}
.rbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.rbar button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 16px;font:inherit;cursor:pointer;transition:all .2s}
.rbar button:hover{border-color:var(--a);color:var(--a)}
.rbar button:disabled{opacity:.5;cursor:default}
#rst{font-size:12px;color:var(--mute)}
.cb .t{height:10px;background:#04070a;border-radius:5px;position:relative;overflow:hidden;min-width:90px;border:1px solid var(--line)}
.cb .f{position:absolute;top:0;bottom:0;border-radius:5px}
.lk{color:var(--a);text-decoration:none;margin-right:12px;white-space:nowrap}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.links a{color:var(--a);text-decoration:none;font-size:13px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;transition:all .2s}
.links a:hover{border-color:var(--a);background:rgba(51,209,182,0.06)}
</style>
<!-- TradingView Lightweight Charts 라이브러리 추가 -->
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<main>
<nav class="tabs" id="tabs">
  <button data-t="cycle" aria-pressed="true">경기 사이클</button>
  <button data-t="macro" aria-pressed="false">매크로 지표</button>
  <button data-t="comm" aria-pressed="false">원자재</button>
  <button data-t="usm" aria-pressed="false">미국 증시</button>
  <button data-t="krm" aria-pressed="false">한국 증시</button>
</nav>

<div class="rbar">
  <button id="rload">⟳ 다시 불러오기</button>
  <button id="rbtn">⚡ 새로 수집</button>
  <button id="rset" title="토큰 설정">⚙</button>
  <span id="rst"></span>
</div>

<nav class="subtabs" id="subtabs" hidden>
  <button data-t="sector" aria-pressed="true">섹터</button>
  <button data-t="us" aria-pressed="false">미국장</button>
  <button data-t="flow" aria-pressed="false">자금 흐름</button>
</nav>

<nav class="subtabs" id="subtabs2" hidden>
  <button data-t="kflow" aria-pressed="true">수급</button>
  <button data-t="kth" aria-pressed="false">테마 TOP10</button>
</nav>

<div class="ctl" id="gctl" style="margin:0 0 14px">
  <div class="seg"><button id="mab" aria-pressed="true">이동평균선</button></div>
  <div class="seg" id="seg"><button data-r="1">1년</button><button data-r="3" aria-pressed="true">3년</button><button data-r="5">5년</button></div>
</div>

<section class="view" id="v-macro" hidden>
  <header><div><h1>매크로 지표</h1><p class="upd" id="upd">불러오는 중…</p></div></header>
  <div id="root"></div>
</section>

<section class="view" id="v-cycle">
  <h1>경기 사이클</h1><p class="upd" id="cupd">불러오는 중…</p><div id="croot"></div>
</section>

<section class="view" id="v-sector" hidden>
  <h1>섹터</h1><p class="upd" id="supd">불러오는 중…</p><div id="sroot"></div>
</section>

<section class="view" id="v-comm" hidden>
  <h1>원자재</h1><p class="upd" id="upd2">불러오는 중…</p><div id="croot2"></div>
</section>

<section class="view" id="v-us" hidden>
  <h1>미국장</h1><p class="upd" id="upd4">불러오는 중…</p>
  <div class="ctl"><div class="seg" id="usr"><button data-n="21" aria-pressed="false">1개월</button><button data-n="63" aria-pressed="true">3개월</button><button data-n="126" aria-pressed="false">6개월</button><button data-n="260" aria-pressed="false">1년</button></div></div>
  <p class="sub" id="usnote"></p><div id="usroot"></div>
</section>

<section class="view" id="v-kflow" hidden>
  <h1>한국 수급</h1><p class="upd" id="upd6">불러오는 중…</p>
  <div class="ctl"><div class="seg" id="kfr"><button data-n="10" aria-pressed="false">10일</button><button data-n="20" aria-pressed="true">20일</button><button data-n="60" aria-pressed="false">60일</button></div></div>
  <p class="sub" id="kfnote"></p><div id="kfroot"></div>
</section>

<section class="view" id="v-kth" hidden>
  <h1>테마 TOP10</h1><p class="upd" id="upd5">불러오는 중…</p>
  <div class="ctl"><div class="seg" id="krr"><button data-n="21" aria-pressed="false">1개월</button><button data-n="63" aria-pressed="true">3개월</button><button data-n="126" aria-pressed="false">6개월</button><button data-n="260" aria-pressed="false">1년</button></div></div>
  <p class="sub" id="krnote"></p><div id="krroot"></div>
</section>

<section class="view" id="v-flow" hidden>
  <h1>자금 흐름</h1><p class="upd" id="upd3">불러오는 중…</p>
  <h2>자산군·섹터 자금 유입 추정</h2><div class="panel" id="fproxy"></div>
  <h2>유동성·달러·머니마켓</h2><div id="froot"></div>
</section>
