<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>매크로 지표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 3번 소프트 네온 테마 스타일 */
:root{
  --bg:#070b10;
  --panel:#101722;
  --panel-hover:#162030;
  --line:#1f2e42;
  --line-focus:#33d1b6;
  --ink:#f1f5f9;
  --mute:#8c9eb5;
  --a:#33d1b6;
  --b:#f59e0b;
  --up:34,197,94;
  --dn:239,68,68;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:860px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:27px;margin:0;font-weight:700;letter-spacing:-.02em;color:#fff}
.upd{color:var(--mute);font-size:13px;margin:3px 0 4px}
.nav a{color:var(--a);font-size:13px;text-decoration:none}
h2{font-size:18px;margin:30px 0 10px;font-weight:700;color:#fff}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,0.3);transition:transform .2s, border-color .2s, box-shadow .2s}
.panel:hover{border-color:rgba(51,209,182,0.3);box-shadow:0 10px 35px rgba(51,209,182,0.06)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.two{grid-template-columns:1fr}}
.panel h3{font-size:14px;margin:0 0 2px;font-weight:700;color:var(--mute)}
.sub{color:var(--mute);font-size:12px;margin:0 0 10px}
.bar{display:grid;grid-template-columns:44px 1fr 52px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.bar .t{height:10px;background:#04070a;border-radius:5px;position:relative;overflow:hidden;border:1px solid var(--line)}
.bar .f{position:absolute;top:0;bottom:0;border-radius:5px}
.bar.best{font-weight:700}
.bar.best b{color:var(--a)}
.verdict{margin-top:12px;padding:14px 16px;border-radius:12px;background:linear-gradient(135deg, rgba(16,33,43,0.8), rgba(15,42,48,0.9));border:1px solid rgba(51,209,182,0.3);font-size:14px;box-shadow:0 4px 20px rgba(51,209,182,0.08)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:max-content;margin-bottom:10px;background:#04070a}
.seg button{background:none;border:0;color:var(--mute);padding:6px 12px;font:inherit;cursor:pointer;transition:all .2s}
.seg button[aria-pressed=true]{background:var(--a);color:#070b10;font-weight:700;box-shadow:0 0 15px rgba(51,209,182,0.4)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.tile{border-radius:12px;padding:10px 12px;min-height:74px;border:1px solid rgba(255,255,255,0.04)}
.tile b{display:block;font-size:20px;font-weight:700}.tile span{font-size:12px;color:#f1f5f9}
.tile small{display:block;font-size:11px;opacity:.75}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500;vertical-align:bottom}
.tag{display:inline-block;font-size:10px;border-radius:6px;padding:0 5px;margin:0 1px;color:#070b10;font-weight:700}
.tag.e{background:var(--b)}.tag.m{background:var(--a)}
.wrap{overflow-x:auto}
.ind td:last-child{text-align:left;color:var(--mute);font-size:12px}
.pill{display:inline-block;border-radius:8px;padding:1px 8px;background:var(--line);color:#fff}
.legend p{margin:4px 0;font-size:13px;color:var(--mute)}.legend strong{color:var(--ink)}
.foot{color:var(--mute);font-size:12px;margin-top:22px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;margin:-8px 0 14px;background:var(--bg);backdrop-filter:blur(10px)}
.tabs button{flex:0 0 auto;background:var(--panel);color:var(--mute);border:1px solid var(--line);border-radius:14px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer;transition:all .2s}
.tabs button:hover{border-color:var(--a);color:var(--ink)}
.tabs button[aria-pressed=true]{background:var(--a);color:#070b10;border-color:var(--a);box-shadow:0 0 20px rgba(51,209,182,0.35)}
.view[hidden],.ctl[hidden],.subtabs[hidden]{display:none}
.subtabs{display:flex;gap:6px;margin:0 0 12px}
.subtabs button{background:none;color:var(--mute);border:1px solid var(--line);border-radius:12px;padding:7px 16px;font:inherit;cursor:pointer;transition:all .2s}
.subtabs button:hover{color:var(--ink);border-color:var(--mute)}
.subtabs button[aria-pressed=true]{color:var(--a);border-color:var(--a);font-weight:700;background:rgba(51,209,182,0.08)}
.chip.c2 i{background:#c58bf2}.chip.c3 i{background:#e57a6f}.chip.c4 i{background:#7bd88f}
.fed table td.l{text-align:left}.fed .add{color:#22c55e}.fed .rem{color:#ef4444}.fed ul{margin:4px 0 8px;padding-left:18px;font-size:12.5px;color:var(--mute)}
.badge{display:inline-block;border-radius:8px;padding:0 8px;font-size:12px;border:1px solid var(--line);font-weight:700}
.badge.h{color:#f59e0b;border-color:rgba(245,158,11,0.4);background:rgba(245,158,11,0.08)}
.badge.d{color:#33d1b6;border-color:rgba(51,209,182,0.4);background:rgba(51,209,182,0.08)}
.up{color:#22c55e;font-weight:600}.dn{color:#ef4444;font-weight:600}
table.us td.l{text-align:left;white-space:nowrap}table.us td.l span{display:block;font-size:11px;color:var(--mute);max-width:200px;overflow:hidden;text-overflow:ellipsis}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;transition:border-color .2s, box-shadow .2s}
details.sec:hover{border-color:rgba(51,209,182,0.4);box-shadow:0 4px 25px rgba(51,209,182,0.07)}
details.sec>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:12px}
details.sec>summary::-webkit-details-marker{display:none}
.st{font-size:17px;font-weight:700;min-width:70px;color:#fff}
.sm{flex:1;display:flex;flex-wrap:wrap;gap:2px 16px;font-size:13px;color:var(--mute)}
.sm b{color:var(--ink);font-size:14px;font-weight:700;margin-left:4px}
.arr{width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .2s;margin:-4px 4px 0 0}
details.sec[open] .arr{transform:rotate(-135deg);margin-top:4px}
.body{padding:4px 18px 16px}
.blk{border-top:1px solid var(--line);padding:16px 0 6px}
h3{font-size:14px;margin:0 0 8px;font-weight:600;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px 20px;margin-bottom:10px}
.chip{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--mute)}
.chip i{width:10px;height:3px;background:var(--a);align-self:center;border-radius:2px}
.chip.c1 i{background:var(--b)}
.chip b{font-size:20px;font-weight:700;color:var(--ink)}
.cv{position:relative;height:200px}
details.info{margin:8px 0 4px}
details.info summary{cursor:pointer;color:var(--a);font-size:13px;list-style:none}
details.info summary::-webkit-details-marker{display:none}
.exp{margin-top:8px;padding:12px 14px;background:#04070a;border-radius:10px;font-size:13px;color:var(--mute);border:1px solid var(--line)}
.exp p{margin:0 0 6px}.exp p:last-child{margin:0}.exp strong{color:var(--ink)}
.gauge{height:6px;background:var(--line);border-radius:3px;margin:8px 0;position:relative;overflow:hidden}
.gauge i{position:absolute;top:0;bottom:0;border-radius:3px}
.srow{cursor:pointer;transition:background .15s}.srow:hover{background:rgba(51,209,182,0.04)}.crow .cv{height:250px;width:100%}.crow td{padding:10px 0;background:#04070a}
.tg{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin-left:6px;color:var(--b);background:rgba(245,158,11,0.06)}
.rbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.rbar button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font:inherit;cursor:pointer;transition:all .2s}
.rbar button:hover{border-color:var(--a);color:var(--a)}
.rbar button:disabled{opacity:.5;cursor:default}
#rst{font-size:12px;color:var(--mute)}
.cb .t{height:10px;background:#04070a;border-radius:5px;position:relative;overflow:hidden;min-width:90px;border:1px solid var(--line)}
.cb .f{position:absolute;top:0;bottom:0;border-radius:5px}
.lk{color:var(--a);text-decoration:none;margin-right:12px;white-space:nowrap}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
.links a{color:var(--a);text-decoration:none;font-size:13px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 12px;transition:all .2s}
.links a:hover{border-color:var(--a);background:rgba(51,209,182,0.06)}
</style>
<!-- TradingView Lightweight Charts 라이브러리 추가 -->
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<main>
<nav class="tabs" id="tabs">
  <button data-t="cycle" aria-pressed="true">경기 사이클</button>
  <button data-t="macro" aria-pressed="false">매크로 지표</button>

<div class="rbar">

<section class="view" id="v-cycle">

  <p class="sub" id="krnote"></p><div id="krroot"></div>

<p class="foot">※ 참고용 일반 정보이며 투자 권유가 아닙니다. 투자 판단과 책임은 본인에게 있습니다.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const SECTIONS=[
["금리",["us_rate","kr_rate"],[
 ["미국·한국 기준금리",["us_rate","kr_rate"],"",{d:"중앙은행이 정하는 정책금리입니다.",w:"회의 직후 발표",n:"금리가 오르면 긴축, 내리면 완화",s:"자산 배분 참고",c:"예상치 차이에 반응"}]]],
["국채 금리",["us10y","us30y","kr3y"],[
 ["미국 국채 10년·30년",["us10y","us30y"],"",{d:"국채 시장 수익률",n:"성장주에 영향",s:"장기금리 급등 주시",c:"수급 영향 있음"}]]],
["환율",["usdkrw","jpykrw","usdjpy"],[
 ["원/달러",["usdkrw"],"",{d:"달러 당 원화",n:"원화 약세 지표",s:"외국인 자금 유출 압력",c:"이벤트 직후 변동성 큼"}]]],
["물가",["cpi","ppi","pce"],[
 ["CPI · 근원 CPI",["cpi","core_cpi"],"",{d:"소비자물가 변동",w:"중순 발표",n:"근원물가 중요",s:"예상치 대비 서프라이즈 핵심",c:"전년 대비 기준"}]]],
["고용",["nfp","unemp"],[
 ["비농업 고용 증감",["nfp"],"bar",{d:"일자리 월간 증감",w:"첫째주 금요일",n:"고용 견조함 확인",s:"수정치 확인 필요",c:"오차 존재"}]]],
["소비",["retail"],[
 ["소매판매",["retail","core_retail"],"",{d:"소매 판매 지표",w:"중순 발표",n:"경기 확장 신호",s:"명목값임",c:"자동차 제외 등"}]]],
["성장",["gdp","gdpnow"],[
 ["GDP 성장률",["gdp","gdpnow"],"",{d:"실질 성장률",w:"분기별 발표",n:"경제 성장 속도",s:"속보치 역할",c:"추정치 오차"}],
 ["ISM 제조업 PMI",["pmi"],"",{d:"제조업 경기 선행지표",w:"매월 첫 영업일",n:"50 이상 확장, 미만 위축",s:"경기 사이클 판단 핵심",c:"체감 경기와 괴리 가능"},{l:[["ISM 공식 사이트","https://www.ismworld.org/"]]}]
]]
];

const SECTIONS2=[
["귀금속",["gold","silver"],[
 ["금·은",["gold","silver"],"",{d:"안전자산 및 산업용 금속",n:"실질금리와 반대",s:"위험회피 신호",c:"구조적 수요"},{y2:["silver"]}]]],
["산업금속",["copper","nickel"],[
 ["구리·니켈",["copper","nickel"],"",{d:"산업 경기 선행지표",n:"수요 반영",s:"괴리 발생 시 점검",c:"공급 요인"},{y2:["nickel"]}]]],
["에너지",["wti","brent","dubai","natgas"],[
 ["원유·천연가스",["wti","brent","dubai","natgas"],"",{d:"에너지 가격",n:"물가 부담",s:"지정학적 이슈",c:"감산 등 민감"},{y2:["natgas"]}]]]
];

const SECTIONS3=[
["연준 유동성",["net_liq"],[
 ["순유동성",["net_liq"],"",{d:"총자산-TGA-역레포",n:"위험자산 우호도",s:"지수 비교",c:"근사치 계산"}]]]
];

let D,range=3;const charts=[],opened=new Set();
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=(v,u)=>v.toLocaleString("ko-KR",{maximumFractionDigits:2})+(u==="%"?"%":" "+u);
const cutoff=()=>{const d=new Date();d.setFullYear(d.getFullYear()-range);return d.toISOString().slice(0,10)};

// 요청하신 20일, 60일, 200일선 이동평균선 설정 반영
const MAMODE={usdkrw:"d",jpykrw:"d",usdjpy:"d",nfp:"m3",unemp:"m3",kr3y:"d",gold:"d",silver:"d",copper:"d",wti:"d",brent:"d",dubai:"m3",nickel:"m3",natgas:"d",mu:"d",skh:"d",sec:"d",usd_idx:"d",net_liq:"w"};
const PAL=["#33d1b6","#f59e0b","#c58bf2","#ef4444","#22c55e"];
const MAS={
  d:[[20,"20일선","#f59e0b"],[60,"60일선","#c58bf2"],[200,"200일선","#33d1b6"]],
  m3:[[3,"3개월 평균","#f59e0b"]],
  w:[[4,"4주 평균","#f59e0b"],[13,"13주 평균","#c58bf2"]]
};
let showMA=true;
function ma(p,n){const o=[];let s=0;for(let i=0;i<p.length;i++){s+=p[i][1];if(i>=n)s-=p[i-n][1];if(i>=n-1)o.push([p[i][0],s/n])}return o}
const maOf=keys=>showMA&&keys.length===1?MAS[MAMODE[keys[0]]]:null;

function draw(cv,keys,type,opts={}){
  const co=cutoff(),labs=new Set(),ds=[];
  const hasY2 = opts.y2 && opts.y2.length > 0;
  keys.forEach((k,i)=>{const x=D.series[k];if(!x)return;
    const m=new Map(x.points.filter(p=>p[0]>=co));m.forEach((_,d)=>labs.add(d));
    const isY2 = hasY2 && opts.y2.includes(k);
    ds.push({label:x.name,m,color:PAL[i]||"#33d1b6",w:1.8,yAxisID:isY2?"y1":"y"});
    if(!isY2){
      (maOf(keys)||[]).forEach(([n,nm,c])=>ds.push({label:nm,m:new Map(ma(x.points,n).filter(p=>p[0]>=co)),color:c,w:1.3,line:1,yAxisID:"y"}));
    }
  });
  const L=[...labs].sort();
  charts.push(new Chart(cv,{type:type||"line",
    data:{labels:L,datasets:ds.map(d=>({...(d.line?{type:"line"}:{}),label:d.label,data:L.map(l=>d.m.has(l)?d.m.get(l):null),
      borderColor:d.color,backgroundColor:d.color,borderWidth:d.w,pointRadius:0,spanGaps:true,yAxisID:d.yAxisID}))},
    options:{maintainAspectRatio:false,animation:false,interaction:{mode:"index",intersect:false},
      plugins:{legend:{display:true,labels:{color:css("--mute"),boxWidth:12}}},
      scales:{x:{grid:{display:false},ticks:{maxTicksLimit:6,color:css("--mute")}},
              y:{type:"linear",display:true,position:"left",grid:{color:css("--line")},ticks:{color:css("--mute")}},
              ...(hasY2?{y1:{type:"linear",display:true,position:"right",grid:{display:false},ticks:{color:css("--mute")}}}:{})
      }}}));
}

const paint=(el,blocks)=>el.querySelectorAll("canvas").forEach(cv=>{const b=blocks[+cv.dataset.i];draw(cv,b[1],b[2],b[4]||{})});
const LAB=[["d","정의"],["w","발표 시기"],["n","핵심 포인트"],["s","투자 활용"],["c","주의할 점"]];

function mk(id,secs,opened){
  const root=document.getElementById(id);if(!root)return;root.innerHTML="";
  secs.forEach(([sec,head,blocks],si)=>{
    const d=document.createElement("details");d.className="sec";d.open=opened.has(si);
    const sm=head.map(k=>{const x=D.series[k];if(!x)return"";const l=x.points[x.points.length-1];
      return`<span>${x.name}<b>${fmt(l[1],x.unit)}</b></span>`}).join("");
    d.innerHTML=`<summary><span class="st">${sec}</span><span class="sm">${sm||"<span>설명 전용</span>"}</span><span class="arr"></span></summary><div class="body">`
      +blocks.map(([title,keys,,info],bi)=>`<div class="blk"><h3>${title}</h3>${info.l?`<div class="links">${info.l.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t} ↗</a>`).join("")}</div>`:""}`
      +(keys.length?`<div class="chips">`+keys.map((k,i)=>{const x=D.series[k];if(!x)return`<span class="chip err">${k}: 수집 실패</span>`;
          const l=x.points[x.points.length-1];
          return`<span class="chip c${i}"><i></i>${x.name} <b>${fmt(l[1],x.unit)}</b> ${l[0]}</span>`}).join("")
        +(maOf(keys)||[]).map(([n,nm,c])=>`<span class="chip"><i style="background:${c}"></i>${nm}</span>`).join("")
        +`</div><div class="cv"><canvas data-i="${bi}"></canvas></div>`:"")
      +`<details class="info"><summary>ⓘ 지표 설명 보기</summary><div class="exp">`
      +LAB.map(([k,t])=>info[k]?`<p><strong>${t}</strong> ${info[k]}</p>`:"").join("")+`</div></details></div>`).join("")
      +`</div>`;
    d.addEventListener("toggle",e=>{if(e.target!==d)return;
      if(d.open){opened.add(si);paint(d,blocks)}else opened.delete(si)});
    root.appendChild(d);
    if(d.open)paint(d,blocks);
  });
}

const opened2=new Set(),opened3=new Set();
let EXD=null;
const tone=v=>v>0.25?["매파","h"]:v<-0.25?["비둘기","d"]:["중립",""];
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function gauge(v){const w=Math.min(50,Math.abs(v)*50),p=v>=0;return`<div class="gauge"><i style="left:${p?50:50-w}%;width:${w}%;background:${p?"#f59e0b":"#33d1b6"}"></i></div>`}

function renderFed(){
  const sec=document.querySelector("#root details.sec"),b=sec&&sec.querySelector(".body");if(!b)return;
  const old=b.querySelector(".fed");if(old)old.remove();
  const f=EXD&&EXD.fed;let h='<div class="blk fed"><h3>FOMC 성명·연준 발언과 뉘앙스</h3>';
  if(!f||!f.statements||!f.statements.length){h+='<p class="sub">'+(EXD?'연준 사이트에서 성명을 가져오지 못했습니다.':'아직 데이터가 없습니다.')+'</p></div>';b.insertAdjacentHTML("afterbegin",h);return}
  const L=f.statements[0],T=tone(L.score);
  h+=`<p><b>${L.date}</b> 최신 FOMC 성명 · 결정 <b>${L.decision}</b>${L.range?" · 목표범위 "+L.range+"%":""} · 뉘앙스 <span class="badge ${T[1]}">${T[0]} ${L.score>0?"+":""}${L.score}</span> <a class="lk" href="${L.url}" target="_blank" rel="noopener">원문 ↗</a></p>${gauge(L.score)}`;
  b.insertAdjacentHTML("afterbegin",h);
}

function renderRates(){
  const sec=[...document.querySelectorAll("#root details.sec")].find(x=>x.querySelector(".st").textContent==="국채 금리"),b=sec&&sec.querySelector(".body");if(!b)return;
  const old=b.querySelector(".rt");if(old)old.remove();
  b.insertAdjacentHTML("afterbegin",'<div class="blk rt"><h3>미국 기준금리와 국채 금리</h3></div>');
}

function renderProxy(m){
  const el=document.getElementById("fproxy");
  if(!m||!m.proxy||!m.proxy.length){el.innerHTML='<p class="sub">ETF 자금 흐름 데이터가 아직 없습니다.</p>';return}
  const G=[...new Set(m.proxy.map(x=>x.g))];
  el.innerHTML=G.map(g=>`<div class="blk"><h3>${g}</h3><table><tr><th></th><th>자금 흐름(CMF)</th><th></th><th>거래대금</th><th>20일</th></tr>`+m.proxy.filter(x=>x.g===g).sort((a,b)=>b.cmf-a.cmf).map(x=>{const w=Math.min(50,Math.abs(x.cmf)/0.4*50),p=x.cmf>=0;return`<tr><td>${x.n} · ${x.t}</td><td class="cb"><div class="t"><div class="f" style="left:${p?50:50-w}%;width:${w}%;background:${p?"var(--a)":"#ef4444"}"></div></div></td><td>${p?"+":""}${x.cmf.toFixed(2)}</td><td>${x.dv.toFixed(2)}배</td><td>${x.r20>0?"+":""}${x.r20.toFixed(1)}%</td></tr>`}).join("")+`</table></div>`).join("");
}

function build(){charts.splice(0).forEach(c=>c.destroy());mk("root",SECTIONS,opened);mk("croot2",SECTIONS2,opened2);mk("froot",SECTIONS3,opened3);renderFed();renderRates()}

document.getElementById("seg").addEventListener("click",e=>{
  const r=e.target.dataset.r;if(!r)return;range=+r;
  document.querySelectorAll("#seg button").forEach(x=>x.setAttribute("aria-pressed",x===e.target));
  build();
});
document.getElementById("mab").addEventListener("click",e=>{showMA=!showMA;e.target.setAttribute("aria-pressed",showMA);build()});

const jf=u=>fetch(u+"?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()});
let SIG="";

function load(){return Promise.all([jf("data.json"),jf("market.json").catch(()=>null),jf("extra.json").catch(()=>null)]).then(([d,m,x])=>{
  D=d;D.series=Object.assign({},d.series,m?m.series:{},x?x.series:{});EXD=x;SIG=d.updated+"|"+(m?m.updated:"");
  document.getElementById("upd").textContent="마지막 갱신 "+d.updated+" (한국시간)";
  ["upd2","upd3"].forEach(k=>{const el=document.getElementById(k);if(el)el.textContent="마지막 갱신 "+d.updated+" (한국시간)"});
  build();renderProxy(m);renderCycle();
}).catch(()=>{document.getElementById("upd").textContent="데이터를 불러오지 못했습니다."})}

function renderCycle(){
  const croot = document.getElementById("croot");
  if(!croot || !D || !D.series) return;
  const gdp = D.series.gdp?.points.slice(-1)[0]?.[1];
  const cpi = D.series.cpi?.points.slice(-1)[0]?.[1];
  const unemp = D.series.unemp?.points.slice(-1)[0]?.[1];
  let phase = "회복기 (Recovery)", desc = "경제 성장률이 회복되고 물가는 안정되는 국면입니다.", cls = "badge d";
  if(gdp > 2.0 && cpi > 3.0) { phase = "과열기 (Overheating)"; desc = "성장과 물가가 모두 높은 국면입니다."; cls = "badge h"; }
  else if(gdp < 1.5 && cpi > 3.0) { phase = "후퇴기 (Slowdown)"; desc = "성장은 둔화되는데 물가가 높은 국면입니다."; cls = "badge h"; }
  else if(gdp < 1.5 && cpi < 2.5) { phase = "침체기 (Recession)"; desc = "경기 침체 및 물가 하락 국면입니다."; cls = "badge d"; }
  croot.innerHTML = `<div class="panel" style="margin-bottom:16px;"><h3>피델리티 비즈니스 사이클 모델 추정</h3><div style="margin:12px 0;"><span class="${cls}" style="font-size:16px; padding:6px 14px;">${phase}</span><p style="margin:8px 0 0; color:var(--mute);">${desc}</p></div></div><div class="panel"><h3>주요 경기 판단 지표</h3><div class="chips" style="margin-top:10px;"><span class="chip"><i></i>실질 GDP <b>${gdp ?? "-"}%</b></span><span class="chip"><i></i>소비자물가(CPI) <b>${cpi ?? "-"}%</b></span><span class="chip"><i></i>실업률 <b>${unemp ?? "-"}%</b></span></div></div>`;
}

load();

// 상단 탭 네비게이션 및 서브탭 전환 이벤트 리스너 복구
const tabs=document.getElementById("tabs"),subtabs=document.getElementById("subtabs"),subtabs2=document.getElementById("subtabs2"),gctl=document.getElementById("gctl");
tabs.addEventListener("click",e=>{
  const btn=e.target.closest("button");if(!btn)return;const t=btn.dataset.t;
  tabs.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===btn));
  subtabs.hidden=t!=="usm";subtabs2.hidden=t!=="krm";
  document.querySelectorAll(".view").forEach(v=>v.hidden=true);
  if(t==="cycle") { document.getElementById("v-cycle").hidden=false; gctl.hidden=true; }
  else if(t==="macro") { document.getElementById("v-macro").hidden=false; gctl.hidden=false; }
  else if(t==="comm") { document.getElementById("v-comm").hidden=false; gctl.hidden=true; }
  else if(t==="usm") { document.getElementById("v-us").hidden=false; gctl.hidden=true; window.__loadU?.(); }
  else if(t==="krm") { document.getElementById("v-kth").hidden=false; gctl.hidden=true; window.__loadK?.(); }
});

subtabs.addEventListener("click",e=>{
  const btn=e.target.closest("button");if(!btn)return;const t=btn.dataset.t;
  subtabs.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===btn));
  document.getElementById("v-us").hidden=t!=="us";
  document.getElementById("v-sector").hidden=t!=="sector";
  document.getElementById("v-flow").hidden=t!=="flow";
});

subtabs2.addEventListener("click",e=>{
  const btn=e.target.closest("button");if(!btn)return;const t=btn.dataset.t;
  subtabs2.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===btn));
  document.getElementById("v-kflow").hidden=t!=="kflow";
  document.getElementById("v-kth").hidden=t!=="kth";
});

document.getElementById("rload").addEventListener("click",async()=>{load()});
</script>

<!-- 미국 증시 및 한국 증시 캔들 차트 연동 스크립트 -->
<script>(()=>{
function stockTab(C){
const $=id=>document.getElementById(id);let U;const chartsMap={};
const sg=(v,d=2)=>v==null?"-":(v>0?"+":"")+v.toFixed(d)+"%",cl=v=>v==null?"":v>=0?"up":"dn",px=v=>v==null?"-":v.toLocaleString("en-US",{minimumFractionDigits:C.dec,maximumFractionDigits:C.dec});

function renderCandle(container, rawData){
  container.innerHTML = "";
  if(!rawData || !rawData.length) { container.innerHTML = "<p class='sub'>차트 데이터가 없습니다.</p>"; return; }
  const chart = LightweightCharts.createChart(container, {
    layout: { background: { type: 'solid', color: '#04070a' }, textColor: '#8c9eb5' },
    grid: { vertLines: { color: '#1f2e42' }, horzLines: { color: '#1f2e42' } },
    timeScale: { borderColor: '#1f2e42' },
    rightPriceScale: { borderColor: '#1f2e42' }
  });
  const candleSeries = chart.addCandlestickSeries({
    upColor: '#22c55e', downColor: '#ef4444',
    borderUpColor: '#22c55e', borderDownColor: '#ef4444',
    wickUpColor: '#22c55e', wickDownColor: '#ef4444',
  });
  const formatted = rawData.map(item => {
    if(typeof item === 'object' && item !== null && item.open !== undefined) {
      return { time: item.time, open: item.open, high: item.high, low: item.low, close: item.close };
    } else {
      let val = Array.isArray(item) ? item[1] : item;
      let timeStr = Array.isArray(item) ? item[0] : "";
      return { time: timeStr, open: val, high: val, low: val, close: val };
    }
  }).filter(x => x.time);
  candleSeries.setData(formatted);
  chart.timeScale().fitContent();
  return chart;
}

const row=(x,e)=>`<tr class="srow" data-t="${x.t}"><td class="l">${C.lab(x,e)}</td><td>${px(x.close)}</td><td class="${cl(x.chg)}">${sg(x.chg)}</td><td class="${cl(x.r5)}">${sg(x.r5,1)}</td><td class="${cl(x.r1m)}">${sg(x.r1m,1)}</td><td class="${cl(x.r3m)}">${sg(x.r3m,1)}</td></tr><tr class="crow" hidden><td colspan="6"><div class="cv"></div></td></tr>`;

function show(open){
  Object.values(chartsMap).forEach(c => { if(c && typeof c.remove === 'function') c.remove(); });
  Object.keys(chartsMap).forEach(k => delete chartsMap[k]);
  const S=[...U.sectors].sort((a,b)=>(b.etf_row.chg??-99)-(a.etf_row.chg??-99));
  $(C.root).innerHTML=S.map(s=>`<details class="sec" data-e="${s.etf}" ${open.has(s.etf)?"open":""}><summary><span class="st">${s.name}</span><span class="sm"><span>${s.etf}<b>${px(s.etf_row.close)}</b></span><span class="${cl(s.etf_row.chg)}"><b>${sg(s.etf_row.chg)}</b></span></span><span class="arr"></span></summary><div class="body"><div class="wrap"><table class="us"><tr><th></th><th>종가(${C.cur})</th><th>전일</th><th>5일</th><th>1개월</th><th>3개월</th></tr>${row(s.etf_row,1)}${s.stocks.map(x=>row(x)).join("")}</table></div><p class="sub">${C.sub}</p></div></details>`).join("");
  $(C.note).textContent=C.nt(U);
}

function openSet(){return new Set([...document.querySelectorAll("#"+C.root+" details[open]")].map(d=>d.dataset.e))}

$(C.root).addEventListener("click",e=>{
  const r=e.target.closest(".srow");if(!r)return;const c=r.nextElementSibling,t=r.dataset.t;
  if(c.hidden){
    c.hidden=false;
    const div=c.querySelector(".cv");
    if(U.px && U.px[t]){ chartsMap[t] = renderCandle(div, U.px[t]); }
  } else {
    c.hidden=true;
    if(chartsMap[t]){ chartsMap[t].remove(); delete chartsMap[t]; }
  }
});

window[C.loader]=()=>fetch(C.json+"?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{U=d;$(C.upd).textContent="마지막 갱신 "+d.updated+" (한국시간)";show(openSet())}).catch(()=>{$(C.upd).textContent="데이터가 없습니다."});
window[C.loader]();
}

stockTab({root:"usroot",note:"usnote",upd:"upd4",json:"us.json",loader:"__loadU",dec:2,cur:"$",lab:(x,e)=>`<b>${x.t}</b>${e?' <span class="tg">ETF</span>':""}<span>${x.n||""}</span>`,nt:U=>"기준일 "+U.asof+" (미국 장마감) · 캔들 차트",sub:"ETF 보유 비중 상위 10종목 · 행을 누르면 캔들 차트가 열립니다."});
stockTab({root:"krroot",note:"krnote",upd:"upd5",json:"krtheme.json",loader:"__loadK",dec:0,cur:"원",lab:(x,e)=>e?`<b>${x.n}</b> <span class="tg">평균</span>`:`<b>${x.n}</b><span>${x.t} · 거래대금 ${x.tv==null?"-":Math.round(x.tv).toLocaleString("ko-KR")}억</span>`,nt:U=>"기준일 "+U.asof+" (한국 장마감) · 테마 평균",sub:"거래대금 상위 10종목 · 행을 누르면 캔들 차트가 열립니다."});
})();</script>
</body>
</html>
