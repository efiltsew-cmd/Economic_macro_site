<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>매크로 지표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#0a1017;--panel:#111a24;--line:#1e2c3a;--ink:#e8eef3;--mute:#8497a8;--a:#4fc3cf;--b:#e5a93d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:820px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:27px;margin:0;font-weight:700;letter-spacing:-.02em}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.upd{color:var(--mute);font-size:13px;margin:3px 0 0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;color:var(--mute);padding:7px 14px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--a);color:#06222a;font-weight:700}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:14px}
details.sec>summary::-webkit-details-marker{display:none}
.st{font-size:18px;font-weight:700;min-width:64px}
.sm{flex:1;display:flex;flex-wrap:wrap;gap:2px 16px;font-size:13px;color:var(--mute)}
.sm b{color:var(--ink);font-size:15px;font-weight:700;margin-left:4px}
.arr{width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .2s;margin:-4px 4px 0 0}
details.sec[open] .arr{transform:rotate(-135deg);margin-top:4px}
.body{padding:2px 18px 14px}
.blk{border-top:1px solid var(--line);padding:16px 0 6px}
h3{font-size:14px;margin:0 0 8px;font-weight:500;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:4px 20px;margin-bottom:8px}
.chip{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--mute)}
.chip i{width:10px;height:3px;background:var(--a);align-self:center}
.chip.c1 i{background:var(--b)}
.chip b{font-size:21px;font-weight:700;color:var(--ink)}
.cv{position:relative;height:200px}
details.info{margin:8px 0 6px}
details.info summary{cursor:pointer;color:var(--a);font-size:13px;list-style:none}
details.info summary::-webkit-details-marker{display:none}
.exp{margin-top:8px;padding:12px 14px;background:var(--bg);border-radius:10px;font-size:13.5px;color:#c4d0da}
.exp p{margin:0 0 6px}.exp p:last-child{margin:0}.exp strong{color:var(--ink)}
.err{color:#e57a6f}
.foot{color:var(--mute);font-size:12px;margin-top:20px}

:root{--bg:#0a1017;--panel:#111a24;--line:#1e2c3a;--ink:#e8eef3;--mute:#8497a8;--a:#4fc3cf;--b:#e5a93d;--up:46,160,110;--dn:224,88,76}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:860px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:27px;margin:0;font-weight:700;letter-spacing:-.02em}
.upd{color:var(--mute);font-size:13px;margin:3px 0 4px}
.nav a{color:var(--a);font-size:13px;text-decoration:none}
h2{font-size:18px;margin:30px 0 10px;font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.two{grid-template-columns:1fr}}
.panel h3{font-size:14px;margin:0 0 2px;font-weight:700}
.sub{color:var(--mute);font-size:12px;margin:0 0 10px}
.bar{display:grid;grid-template-columns:44px 1fr 52px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.bar .t{height:10px;background:var(--bg);border-radius:5px;position:relative;overflow:hidden}
.bar .f{position:absolute;top:0;bottom:0;border-radius:5px}
.bar.best{font-weight:700}
.bar.best b{color:var(--a)}
.verdict{margin-top:12px;padding:14px 16px;border-radius:12px;background:#0f2a30;border:1px solid #1d4a52;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content;margin-bottom:10px}
.seg button{background:none;border:0;color:var(--mute);padding:6px 12px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--a);color:#06222a;font-weight:700}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.tile{border-radius:10px;padding:10px 12px;min-height:74px}
.tile b{display:block;font-size:20px}.tile span{font-size:12px;color:#dfe8ee}
.tile small{display:block;font-size:11px;opacity:.75}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500;vertical-align:bottom}
.tag{display:inline-block;font-size:10px;border-radius:6px;padding:0 5px;margin:0 1px;color:#06222a}
.tag.e{background:var(--b)}.tag.m{background:var(--a)}
.wrap{overflow-x:auto}
.ind td:last-child{text-align:left;color:var(--mute);font-size:12px}
.pill{display:inline-block;border-radius:8px;padding:1px 8px;background:var(--line)}
.legend p{margin:4px 0;font-size:13px;color:#c4d0da}.legend strong{color:var(--ink)}
.foot{color:var(--mute);font-size:12px;margin-top:22px}

main{max-width:860px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;margin:-8px 0 14px;background:var(--bg)}
.tabs button{flex:0 0 auto;background:var(--panel);color:var(--mute);border:1px solid var(--line);border-radius:14px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--a);color:#06222a;border-color:var(--a)}
.view[hidden],.ctl[hidden],.subtabs[hidden]{display:none}
.subtabs{display:flex;gap:6px;margin:0 0 12px}.subtabs button{background:none;color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:7px 16px;font:inherit;cursor:pointer}
.subtabs button[aria-pressed=true]{color:var(--a);border-color:var(--a);font-weight:700}
.chip.c2 i{background:#c58bf2}.chip.c3 i{background:#e57a6f}.chip.c4 i{background:#7bd88f}
.fed table td.l{text-align:left}.fed .add{color:#3fbf86}.fed .rem{color:#e5655b}.fed ul{margin:4px 0 8px;padding-left:18px;font-size:12.5px;color:#c4d0da}
.badge{display:inline-block;border-radius:8px;padding:0 8px;font-size:12px;border:1px solid var(--line)}.badge.h{color:#e5a93d;border-color:#e5a93d}.badge.d{color:#4fc3cf;border-color:#4fc3cf}
.fed .gauge{height:10px;background:var(--bg);border-radius:5px;position:relative;margin:6px 0}.fed .gauge i{position:absolute;top:0;bottom:0;border-radius:5px}
.up{color:#3fbf86}.dn{color:#e5655b}
table.us td.l{text-align:left;white-space:nowrap}table.us td.l span{display:block;font-size:11px;color:var(--mute);max-width:200px;overflow:hidden;text-overflow:ellipsis}
.srow{cursor:pointer}.srow:hover{background:var(--bg)}.crow .cv{height:220px}.crow td{padding:8px 0}
.tg{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;color:var(--b)}
.rbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.rbar button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.rbar button:disabled{opacity:.5;cursor:default}
#rst{font-size:12px;color:var(--mute)}
.cb .t{height:10px;background:var(--bg);border-radius:5px;position:relative;overflow:hidden;min-width:90px}
.cb .f{position:absolute;top:0;bottom:0;border-radius:5px}
.lk{color:var(--a);text-decoration:none;margin-right:12px;white-space:nowrap}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
.links a{color:var(--a);text-decoration:none;font-size:13px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px}
</style>
</head>
<body>
<main>
<nav class="tabs" id="tabs"><button data-t="cycle" aria-pressed="true">경기 사이클</button><button data-t="macro" aria-pressed="false">매크로 지표</button><button data-t="comm" aria-pressed="false">원자재</button><button data-t="usm" aria-pressed="false">미국 증시</button></nav>
<div class="rbar"><button id="rload">⟳ 다시 불러오기</button><button id="rbtn">⚡ 새로 수집</button><button id="rset" title="토큰 설정">⚙</button><span id="rst"></span></div>

</header><div id="root"></div></section>

<section class="view" id="v-sector" hidden><h1>섹터</h1><p class="upd" id="supd">불러오는 중…</p><div id="sroot"></div></section>

<p class="sub" id="usnote"></p><div id="usroot"></div></section>
<section class="view" id="v-flow" hidden><h1>자금 흐름</h1><p class="upd" id="upd3">불러오는 중…</p><h2>자산군·섹터 자금 유입 추정</h2><div class="panel" id="fproxy"></div><h2>유동성·달러·머니마켓</h2><div id="froot"></div></section>

</main>

<script>
// [제목, 지표키들, 차트종류, [의미, 읽는 법, 시장 영향]]
const SECTIONS=[
["금리",["us_rate","kr_rate"],[
 ["미국·한국 기준금리",["us_rate","kr_rate"],"",{d:"중앙은행이 정하는 정책금리입니다. 미국은 연준의 연방기금금리, 한국은 한국은행 기준금리입니다.",w:"미국은 FOMC 회의 직후, 한국은 금융통화위원회 직후 발표됩니다.",n:"금리가 오르면 긴축, 내리면 완화입니다. 미국 금리가 한국보다 높을수록 원화에는 약세 압력이 됩니다.",s:"금리 방향이 바뀌는 시점(인상→동결→인하)에 자산 배분이 크게 달라지는 경향이 있습니다. 한·미 금리 차는 원/달러와 함께 봅니다.",c:"시장은 결정 자체보다 예상과의 차이에 반응하고, 기대를 미리 가격에 반영합니다."}],
 ["정책금리 vs 시장금리 (선반영 근사)",["effr","tb6m","us1y","us2y"],"",{d:"실효 연방기금금리와 6개월·1년·2년 만기 미국채 금리를 한 차트에 겹쳤습니다. 단기·중기 시장금리가 정책금리보다 낮으면 시장이 금리 인하를 앞서 반영하고 있다고 읽는 근사 방법입니다.",n:"2년물이 정책금리보다 눈에 띄게 낮으면 인하 기대가, 높으면 인상(또는 인하 지연) 기대가 반영된 상태로 해석합니다.",s:"CME FedWatch의 회의별 확률은 선물 가격으로 계산하는 값이라 이 차트와 정확히 같지 않습니다. 확률은 링크로 확인하세요.",c:"FedWatch 확률 데이터는 무료로 가져올 수 없어 이 사이트에는 근사 차트만 있습니다.",l:[["CME FedWatch","https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html"]]}],
 ["FOMC · 점도표 (설명 전용)",[],"",{d:"FOMC는 연준의 통화정책 결정 회의로 연 8회 열립니다. 점도표는 위원들의 향후 금리 전망을 점으로 찍은 표입니다.",w:"보통 1·3·4·6·7·9·10·12월에 열리며 해마다 조금씩 다르니 연준 일정표로 확인하세요. 점도표는 3·6·9·12월에 공개됩니다.",n:"점도표가 나오는 3·6·9·12월 회의는 전망이 한꺼번에 바뀌어 변동성이 커지기 쉽습니다.",s:"점도표 중간값이 시장 기대(금리 선물)보다 매파적이면 긴축 장기화 우려, 비둘기적이면 인하 기대로 읽습니다.",c:"점도표는 약속이 아니라 전망이며 경제 데이터에 따라 자주 바뀝니다.",l:[["연준 FOMC 일정·경제전망","https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"]]}]]],
["국채 금리",["us10y","us30y","kr3y"],[
 ["미국 국채 10년·30년",["us10y","us30y"],"",{d:"미국 정부가 발행한 10년·30년 만기 국채의 시장 수익률입니다. 정책금리와 달리 시장에서 매일 결정됩니다.",n:"금리가 오르면(채권 가격 하락) 미래 이익의 할인율이 올라 성장주에 부담이 되는 경향이 있습니다. 10년물은 주택담보대출 등 시중 장기금리의 기준으로 자주 쓰입니다.",s:"장기금리가 단기간에 급등하는 구간에서는 주식 변동성이 커지는 경향이 있어 금리 방향과 속도를 함께 봅니다.",c:"물가 기대, 재정 우려, 국채 입찰 수급 등으로도 움직여 정책금리와 다르게 갈 수 있습니다."}],
 ["한국 국채 3년",["kr3y"],"",{d:"한국 국고채 3년물의 시장 수익률입니다. 기준금리 전망을 민감하게 반영합니다.",n:"기준금리 인하 기대가 커지면 3년물이 먼저 내려가는 경향이 있습니다.",s:"한국 기준금리, 미국 금리와의 차이를 함께 보면 원화 자금 흐름을 가늠하는 데 참고가 됩니다.",c:"데이터는 한국은행 ECOS 기준이며 공휴일에는 값이 없습니다."}],
 ["미국 국채 ETF 가격 (단기·중기·장기)",["shy","ief","tlt"],"",{d:"단기(SHY, 1~3년)·중기(IEF, 7~10년)·장기(TLT, 20년 이상) 미국채 ETF의 가격(달러)입니다. 국채 가격은 금리와 반대로 움직입니다.",n:"금리가 오르면 가격이 내리고, 만기가 길수록 변동폭이 큽니다.",s:"장기물 가격이 급락하면 장기금리 급등으로 읽고 주식 변동성을 함께 점검합니다.",c:"ETF 가격은 만기가 일정하게 유지되도록 갱신되는 상품 가격이라 개별 국채의 가격과는 다릅니다."}],
 ["한국 국채 ETF 가격",["kr3e","kr10e","krf10e"],"",{d:"국고채 3년·10년 ETF와 국채선물 10년 ETF의 가격(원)입니다. 개별 국채 가격 대신 ETF 가격으로 가격 흐름을 봅니다.",n:"금리가 내리면 가격이 오르는 방향이 같고, 만기가 길수록 변동이 큽니다.",s:"한국 기준금리 방향과 함께 보면 채권 시장의 선반영을 확인할 수 있습니다.",c:"종목 코드를 확인하지 못해 수집에 실패하면 수집 실패로 표시됩니다."}],
]],
["환율",["usdkrw","jpykrw","usdjpy"],[
 ["원/달러",["usdkrw"],"",{d:"1달러를 사는 데 필요한 원화입니다.",n:"숫자가 오르면 원화 약세(달러 강세)입니다.",s:"원화 약세는 수출기업에는 우호적일 수 있지만 수입물가와 외국인 자금 유출 압력이 됩니다. 미국 금리·달러 흐름과 함께 봅니다.",c:"CPI·FOMC 발표 직후에 단기 급변동이 잦습니다."}],

    return`<div class="bar${i===best?" best":""}"><span>${DESC[i][0]}</span><div class="t"><div class="f" style="${st}"></div></div><b>${signed?v.toFixed(2):v+"%"}</b></div>`}).join("");
}
function html(D,per){
  const E=D.econ,M=D.market,pi=PER.find(p=>p[0]===per);
  const verdict=E.best===M.best
    ?`경제 지표와 섹터 흐름이 모두 <b>${DESC[E.best][0]} 국면</b>을 가리킵니다.`
    :`경제 지표는 <b>${DESC[E.best][0]} 국면</b>, 섹터 흐름은 <b>${DESC[M.best][0]} 국면</b>에 가깝습니다. 두 신호가 엇갈리면 국면 전환기일 수도 있지만, 단정하지 말고 추이를 지켜보세요.`;
  const sec=[...D.sectors].sort((a,b)=>b.ret[per]-a.ret[per]);
  return`<h2>현재 위치</h2><div class="two">
<div class="panel"><h3>경제 지표 기준</h3><p class="sub">5개 지표가 가리키는 국면 득표율</p>${bars(E.scores,E.best,false)}</div>
<div class="panel"><h3>섹터 흐름 기준</h3><p class="sub">최근 섹터 강약이 피델리티 국면별 패턴과 맞는 정도 (−1~+1)</p>${bars(M.scores,M.best,true)}</div></div>
<div class="verdict">${verdict}</div>
<h2>판단 근거</h2><div class="panel wrap"><table class="ind"><tr><th>지표</th><th>현재</th><th>시사</th><th>기준</th></tr>`
+E.ind.map(x=>`<tr><td>${x.name}</td><td>${x.val}</td><td><span class="pill">${DESC[x.v][0]}</span></td><td>${x.why}</td></tr>`).join("")
+`</table></div>
<h2>섹터 히트맵</h2><div class="seg" id="per">${PER.map(p=>`<button data-p="${p[0]}" aria-pressed="${p[0]===per}">${p[1]}</button>`).join("")}</div>
<div class="heat">${sec.map(s=>`<div class="tile" style="background:${col(s.ret[per],pi[2])}"><span>${s.name} · ${s.etf}</span><b>${sg(s.ret[per])}</b><small>S&amp;P500 대비 3개월 ${sg(s.rel.m3)}</small></div>`).join("")}</div>
<h2>피델리티 국면별 섹터 패턴</h2><div class="panel wrap"><table><tr><th></th>`
+DESC.map((d,i)=>`<th>${d[0]}<br>${E.best===i?'<span class="tag e">경제</span>':""}${M.best===i?'<span class="tag m">섹터</span>':""}</th>`).join("")
+`<th>3개월 상대</th><th>6개월 상대</th></tr>`
+D.sectors.map(s=>`<tr><td>${s.name}</td>`+s.w.map(w=>`<td style="background:${w===0?"transparent":col(w,2.4)}">${SYM[w]}</td>`).join("")+`<td>${sg(s.rel.m3)}</td><td>${sg(s.rel.m6)}</td></tr>`).join("")
+`</table><p class="sub" style="margin-top:10px">++ / + : 해당 국면에서 시장보다 높은 수익률 확률이 매우 높음 / 높음 · −− / − : 낮은 확률 · 빈칸: 뚜렷한 상관 없음. 상대 수익률은 S&amp;P500(SPY) 대비 %p입니다.</p></div>
<h2>국면 설명</h2><div class="panel legend">${DESC.map(d=>`<p><strong>${d[0]}</strong> ${d[1]}</p>`).join("")}</div>`;
}
function show(){
  const full=html(D,per),i=full.indexOf('<h2>섹터 히트맵</h2>'),j=full.indexOf('<h2>국면 설명</h2>');
  document.getElementById("croot").innerHTML=full.slice(0,i)+full.slice(j)+'<p class="foot">※ 규칙으로 계산한 근사치이며 피델리티의 공식 판단이 아닙니다. 과거 패턴이 반복된다는 보장은 없습니다.</p>';
  document.getElementById("sroot").innerHTML='<div class="links"><a href="https://finviz.com/map.ashx" target="_blank" rel="noopener">Finviz 히트맵 ↗</a><a href="https://finviz.com/groups.ashx" target="_blank" rel="noopener">Finviz 섹터·업종 성과 ↗</a></div><p class="sub">SPDR 섹터 ETF 기준 · 배당 포함(총수익률)입니다. Finviz 같은 가격 수익률과는 몇 %p 다를 수 있습니다.</p>'+full.slice(i,j);
  document.getElementById("per").addEventListener("click",e=>{if(e.target.dataset.p){per=e.target.dataset.p;show()}});
}
window.__loadC=()=>fetch("cycle.json?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  D=d;const t="마지막 갱신 "+d.updated+" (한국시간)";["cupd","supd"].forEach(k=>document.getElementById(k).textContent=t);show()
}).catch(()=>{["cupd","supd"].forEach(k=>document.getElementById(k).textContent="아직 데이터가 없습니다. GitHub Actions에서 cycle-update를 한 번 실행해 주세요.")});
window.__loadC();
})();</script>
<script>(()=>{
const $=id=>document.getElementById(id);let U,rng=63,ma=true;const ch={};
const sg=(v,d=2)=>v==null?"-":(v>0?"+":"")+v.toFixed(d)+"%",cl=v=>v==null?"":v>=0?"up":"dn",px=v=>v==null?"-":v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const mav=(a,n)=>a.map((_,i)=>{if(i<n-1)return null;let s=0;for(let k=i-n+1;k<=i;k++){if(a[k]==null)return null;s+=a[k]}return s/n});
function chart(cv,t){const a=U.px[t];if(!a)return;const f=Math.max(0,a.length-rng),L=U.dates.slice(f);
  const ds=[{label:t,data:a.slice(f),borderColor:"#4fc3cf",backgroundColor:"#4fc3cf",borderWidth:1.8}];
  if(ma)[[50,"50일선","#e5a93d"],[200,"200일선","#c58bf2"]].forEach(([n,l,c])=>ds.push({label:l,data:mav(a,n).slice(f),borderColor:c,backgroundColor:c,borderWidth:1.3}));
  ds.forEach(d=>{d.pointRadius=0;d.spanGaps=true});
  ch[t]=new Chart(cv,{type:"line",data:{labels:L,datasets:ds},options:{maintainAspectRatio:false,animation:false,interaction:{mode:"index",intersect:false},plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:6,color:"#8497a8"}},y:{grid:{color:"#1e2c3a"},ticks:{color:"#8497a8"}}}}})}
const row=(x,e)=>`<tr class="srow" data-t="${x.t}"><td class="l"><b>${x.t}</b>${e?' <span class="tg">ETF</span>':""}<span>${x.n||""}</span></td><td>${px(x.close)}</td><td class="${cl(x.chg)}">${sg(x.chg)}</td><td class="${cl(x.r5)}">${sg(x.r5,1)}</td><td class="${cl(x.r1m)}">${sg(x.r1m,1)}</td><td class="${cl(x.r3m)}">${sg(x.r3m,1)}</td></tr><tr class="crow" hidden><td colspan="6"><div class="cv"><canvas></canvas></div></td></tr>`;
function show(open){Object.values(ch).forEach(c=>c.destroy());Object.keys(ch).forEach(k=>delete ch[k]);
  const S=[...U.sectors].sort((a,b)=>(b.etf_row.chg??-99)-(a.etf_row.chg??-99));
  $("usroot").innerHTML=S.map((s,i)=>`<details class="sec" data-e="${s.etf}" ${open.has(s.etf)?"open":""}><summary><span class="st">${s.name}</span><span class="sm"><span>${s.etf}<b>${px(s.etf_row.close)}</b></span><span class="${cl(s.etf_row.chg)}"><b>${sg(s.etf_row.chg)}</b></span></span><span class="arr"></span></summary><div class="body"><div class="wrap"><table class="us"><tr><th></th><th>종가($)</th><th>전일</th><th>5일</th><th>1개월</th><th>3개월</th></tr>${row(s.etf_row,1)}${s.stocks.map(x=>row(x)).join("")}</table></div>${s.src==="fixed"?'<p class="sub">보유종목을 자동으로 불러오지 못해 고정 목록(상위 5종목)을 표시합니다. 순위가 실제와 다를 수 있습니다.</p>':'<p class="sub">ETF 보유 비중 상위 5종목 · 종목을 누르면 차트가 열립니다.</p>'}</div></details>`).join("");
  $("usnote").textContent="기준일 "+U.asof+" (미국 장마감) · 종가는 배당 미반영 · 주말·휴장일에는 직전 거래일";}
function openSet(){return new Set([...document.querySelectorAll("#usroot details[open]")].map(d=>d.dataset.e))}
$("usroot").addEventListener("click",e=>{const r=e.target.closest(".srow");if(!r)return;const c=r.nextElementSibling,t=r.dataset.t;
  if(c.hidden){c.hidden=false;chart(c.querySelector("canvas"),t)}else{c.hidden=true;if(ch[t]){ch[t].destroy();delete ch[t]}}});
function redraw(){document.querySelectorAll("#usroot .crow:not([hidden])").forEach(c=>{const t=c.previousElementSibling.dataset.t;if(ch[t]){ch[t].destroy();delete ch[t]}chart(c.querySelector("canvas"),t)})}
$("usr").addEventListener("click",e=>{const n=e.target.dataset.n;if(!n)return;rng=+n;document.querySelectorAll("#usr button").forEach(b=>b.setAttribute("aria-pressed",b===e.target));redraw()});
$("usma").addEventListener("click",e=>{ma=!ma;e.target.setAttribute("aria-pressed",ma);redraw()});
window.__loadU=()=>fetch("us.json?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{U=d;window.__USIG=d.updated;$("upd4").textContent="마지막 갱신 "+d.updated+" (한국시간)";show(openSet())}).catch(()=>{$("upd4").textContent="아직 데이터가 없습니다. GitHub Actions에서 us-update를 한 번 실행해 주세요."});
window.__loadU();
})();</script>
<script>(()=>{const top=[...document.querySelectorAll("#tabs button")],subs=[...document.querySelectorAll("#subtabs button")],V=["macro","cycle","sector","us","comm","flow"],SUB=["sector","us","flow"];let last="sector";
function go(t){const inUS=SUB.includes(t);if(inUS)last=t;
  top.forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===(inUS?"usm":t)));subs.forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===t));
  document.getElementById("subtabs").hidden=!inUS;V.forEach(v=>document.getElementById("v-"+v).hidden=v!==t);
  document.getElementById("gctl").hidden=(t==="cycle"||t==="sector"||t==="us");history.replaceState(null,"","#"+t);window.scrollTo(0,0)}
document.getElementById("tabs").addEventListener("click",e=>{const t=e.target.dataset.t;if(t)go(t==="usm"?last:t)});
document.getElementById("subtabs").addEventListener("click",e=>{const t=e.target.dataset.t;if(t)go(t)});
const h=location.hash.slice(1);go(V.includes(h)?h:"cycle")})();</script>
