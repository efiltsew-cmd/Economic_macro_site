<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>매크로 지표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#0a1017;--panel:#111a24;--line:#1e2c3a;--ink:#e8eef3;--mute:#8497a8;--a:#4fc3cf;--b:#e5a93d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:820px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:27px;margin:0;font-weight:700;letter-spacing:-.02em}
.upd{color:var(--mute);font-size:13px;margin:3px 0 0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;color:var(--mute);padding:7px 14px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--a);color:#06222a;font-weight:700}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:14px}
details.sec>summary::-webkit-details-marker{display:none}
.st{font-size:18px;font-weight:700;min-width:64px}
.sm{flex:1;display:flex;flex-wrap:wrap;gap:2px 16px;font-size:13px;color:var(--mute)}
.sm b{color:var(--ink);font-size:15px;font-weight:700;margin-left:4px}
.arr{width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .2s;margin:-4px 4px 0 0}
details.sec[open] .arr{transform:rotate(-135deg);margin-top:4px}
.body{padding:2px 18px 14px}
.blk{border-top:1px solid var(--line);padding:16px 0 6px}
h3{font-size:14px;margin:0 0 8px;font-weight:500;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:4px 20px;margin-bottom:8px}
.chip{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--mute)}
.chip i{width:10px;height:3px;background:var(--a);align-self:center}
.chip.c1 i{background:var(--b)}
.chip b{font-size:21px;font-weight:700;color:var(--ink)}
.cv{position:relative;height:200px}
details.info{margin:8px 0 6px}
details.info summary{cursor:pointer;color:var(--a);font-size:13px;list-style:none}
details.info summary::-webkit-details-marker{display:none}
.exp{margin-top:8px;padding:12px 14px;background:var(--bg);border-radius:10px;font-size:13.5px;color:#c4d0da}
.exp p{margin:0 0 6px}.exp p:last-child{margin:0}.exp strong{color:var(--ink)}
.err{color:#e57a6f}
.foot{color:var(--mute);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<main>
<header>
  <div><h1>매크로 지표</h1><p class="upd" id="upd">불러오는 중…</p></div>
  <div class="seg" id="seg"><button data-r="1">1년</button><button data-r="3" aria-pressed="true">3년</button><button data-r="5">5년</button></div>
</header>
<div id="root"></div>
<p class="foot">※ 참고용 일반 정보이며 투자 권유가 아닙니다. 투자 판단과 책임은 본인에게 있습니다.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
// [제목, 지표키들, 차트종류, [의미, 읽는 법, 시장 영향]]
const SECTIONS=[
["금리",["us_rate","kr_rate"],[
 ["미국·한국 기준금리",["us_rate","kr_rate"],"",{d:"중앙은행이 정하는 정책금리입니다. 미국은 연준의 연방기금금리, 한국은 한국은행 기준금리입니다.",w:"미국은 FOMC 회의 직후, 한국은 금융통화위원회 직후 발표됩니다.",n:"금리가 오르면 긴축, 내리면 완화입니다. 미국 금리가 한국보다 높을수록 원화에는 약세 압력이 됩니다.",s:"금리 방향이 바뀌는 시점(인상→동결→인하)에 자산 배분이 크게 달라지는 경향이 있습니다. 한·미 금리 차는 원/달러와 함께 봅니다.",c:"시장은 결정 자체보다 예상과의 차이에 반응하고, 기대를 미리 가격에 반영합니다."}],
 ["FOMC · 점도표 (설명 전용)",[],"",{d:"FOMC는 연준의 통화정책 결정 회의로 연 8회 열립니다. 점도표는 위원들의 향후 금리 전망을 점으로 찍은 표입니다.",w:"보통 1·3·4·6·7·9·10·12월에 열리며 해마다 조금씩 다르니 연준 일정표로 확인하세요. 점도표는 3·6·9·12월에 공개됩니다.",n:"점도표가 나오는 3·6·9·12월 회의는 전망이 한꺼번에 바뀌어 변동성이 커지기 쉽습니다.",s:"점도표 중간값이 시장 기대(금리 선물)보다 매파적이면 긴축 장기화 우려, 비둘기적이면 인하 기대로 읽습니다.",c:"점도표는 약속이 아니라 전망이며 경제 데이터에 따라 자주 바뀝니다."}]]],
["환율",["usdkrw","jpykrw","usdjpy"],[
 ["원/달러",["usdkrw"],"",{d:"1달러를 사는 데 필요한 원화입니다.",n:"숫자가 오르면 원화 약세(달러 강세)입니다.",s:"원화 약세는 수출기업에는 우호적일 수 있지만 수입물가와 외국인 자금 유출 압력이 됩니다. 미국 금리·달러 흐름과 함께 봅니다.",c:"CPI·FOMC 발표 직후에 단기 급변동이 잦습니다."}],
 ["원/100엔",["jpykrw"],"",{d:"100엔을 사는 데 필요한 원화입니다.",n:"오르면 엔 강세·원 약세입니다.",s:"일본 여행·수입 비용과 한일 수출 경쟁력 판단에 쓰입니다."}],
 ["달러/엔",["usdjpy"],"",{d:"1달러에 해당하는 엔화입니다.",n:"오르면 엔 약세입니다. 미·일 금리 차의 영향이 큽니다.",s:"엔이 급격히 강해지면 엔 캐리 청산으로 글로벌 변동성이 커지는 경향이 있어 위험 신호로 참고합니다."}]]],
["물가",["cpi","ppi","pce"],[
 ["CPI · 근원 CPI (전년 대비)",["cpi","core_cpi"],"",{d:"소비자가 실제로 지불하는 상품·서비스 가격의 평균 변동입니다. 헤드라인 CPI는 식품·에너지를 포함한 전체, 근원 CPI는 식품·에너지를 뺀 값입니다.",w:"매월 중순쯤 발표됩니다.",n:"근원 CPI가 구조적인 물가 흐름을 보여주고 연준이 더 중시합니다. CPI가 예상보다 높게 나오면 시장은 긴축 장기화를 우려합니다.",s:"발표 직후 변동성이 커서 예상치 대비 서프라이즈가 핵심입니다. 주거비·서비스 물가가 끈적한지 함께 확인합니다.",c:"이 차트는 전년 대비입니다. 뉴스에 나오는 전월 대비 수치와는 값이 다릅니다."}],
 ["PPI (전년 대비)",["ppi"],"",{d:"생산자가 받는 도매 단계의 가격입니다. 인플레이션의 선행지표로 봅니다.",w:"매월 중순쯤, CPI 발표 전후 1~2일 간격이며 순서는 달마다 다를 수 있습니다.",n:"기업의 비용 압력을 보여주며 이후 소비자물가에 전가되는지가 관건입니다.",s:"PPI는 오르는데 CPI는 안 오르면 기업 마진 압박 신호로 읽힙니다.",c:"이 사이트는 FRED의 전품목 PPI 기준이라 뉴스의 최종수요 PPI와 값이 다를 수 있습니다."}],
 ["PCE · 근원 PCE (전년 대비)",["pce","core_pce"],"",{d:"개인소비지출 물가입니다. 연준이 통화정책을 결정할 때 공식 기준으로 삼는 물가지표입니다.",w:"CPI보다 약 2주 늦게 발표됩니다.",n:"내구재·비내구재·서비스 중 서비스 물가가 핵심입니다. 연준의 목표는 2%입니다.",s:"CPI·PPI 결과로 PCE를 미리 추정하는 분석이 흔해, 실제 발표는 확인 성격이 강합니다.",c:"가중치 차이로 보통 CPI보다 낮게 나오는 경향이 있습니다."}]]],
["고용",["nfp","unemp"],[
 ["비농업 고용 증감 (전월 대비)",["nfp"],"bar",{d:"농업을 제외한 미국 일자리의 월간 증감(천 명)입니다.",w:"매월 첫째 주 금요일(예외 있음)에 발표됩니다.",n:"너무 강하면 금리 인하가 늦어질 수 있고, 너무 약하면 침체 우려가 커집니다.",s:"전월·전전월 수정치와 임금 상승률을 함께 보면 물가 압력까지 판단할 수 있습니다.",c:"발표 후 수정 폭이 커서 첫 숫자만으로 단정하기 어렵습니다."}],
 ["실업률",["unemp"],"",{d:"경제활동인구 중 일자리를 찾는 사람의 비율입니다.",w:"비농업 고용과 같은 날 발표됩니다.",n:"낮을수록 고용이 견조합니다. 짧은 기간에 빠르게 오르면 침체 신호로 보는 경험칙이 있습니다.",s:"상승은 소비 둔화와 금리 인하 기대로 이어지는 경향이 있어 채권·성장주 해석에 참고합니다."}]]],
["소비",["retail"],[
 ["소매판매 · 코어 소매판매 (전월 대비)",["retail","core_retail"],"",{d:"헤드라인(total)은 전체 소매 판매입니다. 코어는 자동차 부품을 제외한 Ex-Auto 지표이고, 휘발유까지 뺀 Ex-Auto & Gas 지표도 있습니다.",w:"매월 중순쯤 발표됩니다.",n:"헤드라인은 자동차 판매와 변동성이 큰 휘발유 가격의 비중이 커서 코어로 함께 봅니다.",s:"소매판매 증가는 경기 확장 신호로 시사됩니다.",c:"명목 값이라 물가 영향이 섞여 있습니다. 이 사이트의 코어는 자동차 제외 기준만 표시합니다."}],
 ["컨트롤 그룹 (설명 전용)",[],"",{d:"소매판매에서 자동차, 휘발유, 건축자재, 음식 서비스를 제외한 수치입니다.",w:"소매판매와 같이 매월 중순쯤 발표됩니다.",n:"PCE 산출에 직접 들어가서 실질적인 성장률 전망과 직결됩니다.",s:"GDP 개인소비 추정에 쓰여, 발표 후 분기 성장률 전망이 수정되는 계기가 됩니다.",c:"현재 이 사이트는 이 지표를 수집하지 않아 설명만 제공합니다."}]]],
["성장",["gdp","gdpnow"],[
 ["GDP 성장률 · GDPNow",["gdp","gdpnow"],"",{d:"명목 GDP는 현재 시장 가격으로, 실질 GDP는 물가 상승분을 뺀 값으로 계산합니다. 차트의 GDP는 실질 성장률(전기 대비 연율)이고, GDPNow는 애틀랜타 연준의 실시간 추정치입니다.",w:"GDP는 분기 종료 후 속보·잠정·확정으로 세 번 발표됩니다.",n:"GDPNow는 데이터가 나올 때마다 갱신되어 공식 발표 전 속보 역할을 합니다.",s:"GDPNow가 급변하면 시장의 성장 기대가 바뀌는 신호로 참고합니다. 분기 초반 값은 오차가 큽니다.",c:"추정치라 변동이 크고 공식 값과 차이가 날 수 있습니다."}],
 ["WEI 주간경제지수 (설명 전용)",[],"",{d:"주 단위 경제활동 지표를 묶어 GDP 성장률 흐름에 맞춰 만든 지수입니다. 댈러스 연준이 발표합니다.",w:"매주 갱신됩니다.",n:"월·분기 지표 사이의 공백을 메우는 주간 체온계입니다.",c:"현재 이 사이트는 수집하지 않아 설명만 제공합니다."}]]],
["경기",[],[
 ["ISM PMI (설명 전용)",[],"",{d:"ISM 구매관리자지수는 구매 담당자 설문으로 만듭니다. 50 이상이면 확장, 미만이면 수축으로 봅니다.",w:"매월 첫째 주에 가장 먼저 나오는 선행지표입니다. 제조업은 첫 영업일, 서비스업은 3번째 영업일 무렵입니다.",n:"신규 주문 수를 봐야 합니다. 상승장에서 추가적인 확신을 줄 때 쓰는 보조 지표입니다.",s:"신규 주문과 재고의 격차, 가격 지수(물가 압력)를 함께 확인합니다.",c:"무료 자동 수집이 어려워 이 사이트에서는 제외하고 설명만 제공합니다."}]]]
];
let D,range=3;const charts=[],opened=new Set();
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=(v,u)=>v.toLocaleString("ko-KR",{maximumFractionDigits:2})+(u==="%"?"%":" "+u);
const cutoff=()=>{const d=new Date();d.setFullYear(d.getFullYear()-range);return d.toISOString().slice(0,10)};
function draw(cv,keys,type){
  const co=cutoff(),labs=new Set();
  const ds=keys.map((k,i)=>{const x=D.series[k];if(!x)return null;
    const m=new Map(x.points.filter(p=>p[0]>=co));m.forEach((_,d)=>labs.add(d));
    return{label:x.name,m,color:css(i?"--b":"--a")}}).filter(Boolean);
  const L=[...labs].sort();
  charts.push(new Chart(cv,{type:type||"line",
    data:{labels:L,datasets:ds.map(d=>({label:d.label,data:L.map(l=>d.m.has(l)?d.m.get(l):null),
      borderColor:d.color,backgroundColor:d.color,borderWidth:1.8,pointRadius:0,spanGaps:true}))},
    options:{maintainAspectRatio:false,animation:false,interaction:{mode:"index",intersect:false},
      plugins:{legend:{display:false}},
      scales:{x:{grid:{display:false},ticks:{maxTicksLimit:6,color:css("--mute")}},
              y:{grid:{color:css("--line")},ticks:{color:css("--mute")}}}}}));
}
const paint=(el,blocks)=>el.querySelectorAll("canvas").forEach(cv=>{const b=blocks[+cv.dataset.i];draw(cv,b[1],b[2])});
const LAB=[["d","정의"],["w","발표 시기"],["n","핵심 포인트"],["s","투자 활용"],["c","주의할 점"]];
function build(){
  charts.splice(0).forEach(c=>c.destroy());
  const root=document.getElementById("root");root.innerHTML="";
  SECTIONS.forEach(([sec,head,blocks],si)=>{
    const d=document.createElement("details");d.className="sec";d.open=opened.has(si);
    const sm=head.map(k=>{const x=D.series[k];if(!x)return"";const l=x.points[x.points.length-1];
      return`<span>${x.name}<b>${fmt(l[1],x.unit)}</b></span>`}).join("");
    d.innerHTML=`<summary><span class="st">${sec}</span><span class="sm">${sm||"<span>설명 전용</span>"}</span><span class="arr"></span></summary><div class="body">`
      +blocks.map(([title,keys,,info],bi)=>`<div class="blk"><h3>${title}</h3>`
      +(keys.length?`<div class="chips">`+keys.map((k,i)=>{const x=D.series[k];if(!x)return`<span class="chip err">${k}: 수집 실패</span>`;
          const l=x.points[x.points.length-1];
          return`<span class="chip c${i}"><i></i>${x.name} <b>${fmt(l[1],x.unit)}</b> ${l[0]}</span>`}).join("")
        +`</div><div class="cv"><canvas data-i="${bi}"></canvas></div>`:"")
      +`<details class="info"><summary>ⓘ 지표 설명 보기</summary><div class="exp">`
      +LAB.map(([k,t])=>info[k]?`<p><strong>${t}</strong> ${info[k]}</p>`:"").join("")+`</div></details></div>`).join("")
      +`</div>`;
    d.addEventListener("toggle",e=>{if(e.target!==d)return;
      if(d.open){opened.add(si);paint(d,blocks)}else opened.delete(si)});
    root.appendChild(d);
    if(d.open)paint(d,blocks);
  });
}
document.getElementById("seg").addEventListener("click",e=>{
  const r=e.target.dataset.r;if(!r)return;range=+r;
  document.querySelectorAll("#seg button").forEach(x=>x.setAttribute("aria-pressed",x===e.target));
  build();
});
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{
  D=d;document.getElementById("upd").textContent="마지막 갱신 "+d.updated+" (한국시간)";build();
}).catch(()=>{document.getElementById("upd").textContent="데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요."});
</script>
</body>
</html>
