<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>매크로 지표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#0a1017;--panel:#111a24;--line:#1e2c3a;--ink:#e8eef3;--mute:#8497a8;--a:#4fc3cf;--b:#e5a93d;--up:46,160,110;--dn:224,88,76}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:860px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:27px;margin:0;font-weight:700;letter-spacing:-.02em}
.upd{color:var(--mute);font-size:13px;margin:3px 0 4px}
.nav a{color:var(--a);font-size:13px;text-decoration:none}
h2{font-size:18px;margin:30px 0 10px;font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.two{grid-template-columns:1fr}}
.panel h3{font-size:14px;margin:0 0 2px;font-weight:700}
.sub{color:var(--mute);font-size:12px;margin:0 0 10px}
.bar{display:grid;grid-template-columns:44px 1fr 52px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.bar .t{height:10px;background:var(--bg);border-radius:5px;position:relative;overflow:hidden}
.bar .f{position:absolute;top:0;bottom:0;border-radius:5px}
.bar.best{font-weight:700}
.bar.best b{color:var(--a)}
.verdict{margin-top:12px;padding:14px 16px;border-radius:12px;background:#0f2a30;border:1px solid #1d4a52;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content;margin-bottom:10px}
.seg button{background:none;border:0;color:var(--mute);padding:6px 12px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--a);color:#06222a;font-weight:700}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.tile{border-radius:10px;padding:10px 12px;min-height:74px}
.tile b{display:block;font-size:20px}.tile span{font-size:12px;color:#dfe8ee}
.tile small{display:block;font-size:11px;opacity:.75}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500;vertical-align:bottom}
.tag{display:inline-block;font-size:10px;border-radius:6px;padding:0 5px;margin:0 1px;color:#06222a}
.tag.e{background:var(--b)}.tag.m{background:var(--a)}
.wrap{overflow-x:auto}
.ind td:last-child{text-align:left;color:var(--mute);font-size:12px}
.pill{display:inline-block;border-radius:8px;padding:1px 8px;background:var(--line)}
.legend p{margin:4px 0;font-size:13px;color:#c4d0da}.legend strong{color:var(--ink)}
.foot{color:var(--mute);font-size:12px;margin-top:22px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;margin:-8px 0 14px;background:var(--bg)}
.tabs button{flex:0 0 auto;background:var(--panel);color:var(--mute);border:1px solid var(--line);border-radius:14px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--a);color:#06222a;border-color:var(--a)}
.view[hidden],.ctl[hidden],.subtabs[hidden]{display:none}
.subtabs{display:flex;gap:6px;margin:0 0 12px}.subtabs button{background:none;color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:7px 16px;font:inherit;cursor:pointer}
.subtabs button[aria-pressed=true]{color:var(--a);border-color:var(--a);font-weight:700}
.chip.c2 i{background:#c58bf2}.chip.c3 i{background:#e57a6f}.chip.c4 i{background:#7bd88f}
.fed table td.l{text-align:left}.fed .add{color:#3fbf86}.fed .rem{color:#e5655b}.fed ul{margin:4px 0 8px;padding-left:18px;font-size:12.5px;color:#c4d0da}
.badge{display:inline-block;border-radius:8px;padding:0 8px;font-size:12px;border:1px solid var(--line)}.badge.h{color:#e5a93d;border-color:#e5a93d}.badge.d{color:#4fc3cf;border-color:#4fc3cf}
.up{color:#3fbf86}.dn{color:#e5655b}
table.us td.l{text-align:left;white-space:nowrap}table.us td.l span{display:block;font-size:11px;color:var(--mute);max-width:200px;overflow:hidden;text-overflow:ellipsis}
.srow{cursor:pointer}.srow:hover{background:var(--bg)}.crow .cv{height:250px;width:100%}.crow td{padding:8px 0}
.tg{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;color:var(--b)}
.rbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.rbar button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.rbar button:disabled{opacity:.5;cursor:default}
#rst{font-size:12px;color:var(--mute)}
.cb .t{height:10px;background:var(--bg);border-radius:5px;position:relative;overflow:hidden;min-width:90px}
.cb .f{position:absolute;top:0;bottom:0;border-radius:5px}
.lk{color:var(--a);text-decoration:none;margin-right:12px;white-space:nowrap}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
.links a{color:var(--a);text-decoration:none;font-size:13px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px}
</style>
<!-- TradingView Lightweight Charts 라이브러리 추가 -->
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<main>
<nav class="tabs" id="tabs"><button data-t="cycle" aria-pressed="true">경기 사이클</button><button data-t="macro" aria-pressed="false">매크로 지표</button><button data-t="comm" aria-pressed="false">원자재</button><button data-t="usm" aria-pressed="false">미국 증시</button><button data-t="krm" aria-pressed="false">한국 증시</button></nav>
<div class="rbar"><button id="rload">⟳ 다시 불러오기</button><button id="rbtn">⚡ 새로 수집</button><button id="rset" title="토큰 설정">⚙</button><span id="rst"></span></div>
<nav class="subtabs" id="subtabs" hidden><button data-t="sector" aria-pressed="true">섹터</button><button data-t="us" aria-pressed="false">미국장</button><button data-t="flow" aria-pressed="false">자금 흐름</button></nav>
<nav class="subtabs" id="subtabs2" hidden><button data-t="kflow" aria-pressed="true">수급</button><button data-t="kth" aria-pressed="false">테마 TOP10</button></nav>
<div class="ctl" id="gctl" style="margin:0 0 14px"><div class="seg"><button id="mab" aria-pressed="true">이동평균선</button></div><div class="seg" id="seg"><button data-r="1">1년</button><button data-r="3" aria-pressed="true">3년</button><button data-r="5">5년</button></div></div>
<section class="view" id="v-macro"><header><div><h1>매크로 지표</h1><p class="upd" id="upd">불러오는 중…</p></div></header><div id="root"></div></section>
<section class="view" id="v-cycle" hidden><h1>경기 사이클</h1><p class="upd" id="cupd">불러오는 중…</p><div id="croot"></div></section>
<section class="view" id="v-sector" hidden><h1>섹터</h1><p class="upd" id="supd">불러오는 중…</p><div id="sroot"></div></section>
<section class="view" id="v-comm" hidden><h1>원자재</h1><p class="upd" id="upd2">불러오는 중…</p><div id="croot2"></div></section>
<section class="view" id="v-us" hidden><h1>미국장</h1><p class="upd" id="upd4">불러오는 중…</p>
<div class="ctl"><div class="seg" id="usr"><button data-n="21" aria-pressed="false">1개월</button><button data-n="63" aria-pressed="true">3개월</button><button data-n="126" aria-pressed="false">6개월</button><button data-n="260" aria-pressed="false">1년</button></div></div>
<p class="sub" id="usnote"></p><div id="usroot"></div></section>
<section class="view" id="v-kflow" hidden><h1>한국 수급</h1><p class="upd" id="upd6">불러오는 중…</p>
<div class="ctl"><div class="seg" id="kfr"><button data-n="10" aria-pressed="false">10일</button><button data-n="20" aria-pressed="true">20일</button><button data-n="60" aria-pressed="false">60일</button></div></div>
<p class="sub" id="kfnote"></p><div id="kfroot"></div></section>
<section class="view" id="v-kth" hidden><h1>테마 TOP10</h1><p class="upd" id="upd5">불러오는 중…</p>
<div class="ctl"><div class="seg" id="krr"><button data-n="21" aria-pressed="false">1개월</button><button data-n="63" aria-pressed="true">3개월</button><button data-n="126" aria-pressed="false">6개월</button><button data-n="260" aria-pressed="false">1년</button></div></div>
<p class="sub" id="krnote"></p><div id="krroot"></div></section>
<section class="view" id="v-flow" hidden><h1>자금 흐름</h1><p class="upd" id="upd3">불러오는 중…</p><h2>자산군·섹터 자금 유입 추정</h2><div class="panel" id="fproxy"></div><h2>유동성·달러·머니마켓</h2><div id="froot"></div></section>
<p class="foot">※ 참고용 일반 정보이며 투자 권유가 아닙니다. 투자 판단과 책임은 본인에게 있습니다.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const SECTIONS=[
["금리",["us_rate","kr_rate"],[
 ["미국·한국 기준금리",["us_rate","kr_rate"],"",{d:"중앙은행이 정하는 정책금리입니다.",w:"회의 직후 발표",n:"금리가 오르면 긴축, 내리면 완화",s:"자산 배분 참고",c:"예상치 차이에 반응"}]]],
["국채 금리",["us10y","us30y","kr3y"],[
 ["미국 국채 10년·30년",["us10y","us30y"],"",{d:"국채 시장 수익률",n:"성장주에 영향",s:"장기금리 급등 주시",c:"수급 영향 있음"}]]],
["환율",["usdkrw","jpykrw","usdjpy"],[
 ["원/달러",["usdkrw"],"",{d:"달러 당 원화",n:"원화 약세 지표",s:"외국인 자금 유출 압력",c:"이벤트 직후 변동성 큼"}]]],
["물가",["cpi","ppi","pce"],[
 ["CPI · 근원 CPI",["cpi","core_cpi"],"",{d:"소비자물가 변동",w:"중순 발표",n:"근원물가 중요",s:"예상치 대비 서프라이즈 핵심",c:"전년 대비 기준"}]]],
["고용",["nfp","unemp"],[
 ["비농업 고용 증감",["nfp"],"bar",{d:"일자리 월간 증감",w:"첫째주 금요일",n:"고용 견조함 확인",s:"수정치 확인 필요",c:"오차 존재"}]]],
["소비",["retail"],[
 ["소매판매",["retail","core_retail"],"",{d:"소매 판매 지표",w:"중순 발표",n:"경기 확장 신호",s:"명목값임",c:"자동차 제외 등"}]]],
["성장",["gdp","gdpnow"],[
 ["GDP 성장률",["gdp","gdpnow"],"",{d:"실질 성장률",w:"분기별 발표",n:"경제 성장 속도",s:"속보치 역할",c:"추정치 오차"}]]]
];
const SECTIONS2=[
["귀금속",["gold","silver"],[
 ["금·은",["gold","silver"],"",{d:"안전자산 및 산업용 금속",n:"실질금리와 반대",s:"위험회피 신호",c:"구조적 수요"}]]],
["산업금속",["copper","nickel"],[
 ["구리·니켈",["copper","nickel"],"",{d:"산업 경기 선행지표",n:"수요 반영",s:"괴리 발생 시 점검",c:"공급 요인"}]]],
["에너지",["wti","brent","dubai","natgas"],[
 ["원유·천연가스",["wti","brent","dubai","natgas"],"",{d:"에너지 가격",n:"물가 부담",s:"지정학적 이슈",c:"감산 등 민감"}]]]
];
const SECTIONS3=[
["연준 유동성",["net_liq"],[
 ["순유동성",["net_liq"],"",{d:"총자산-TGA-역레포",n:"위험자산 우호도",s:"지수 비교",c:"근사치 계산"}]]]
];
let D,range=3;const charts=[],opened=new Set();
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=(v,u)=>v.toLocaleString("ko-KR",{maximumFractionDigits:2})+(u==="%"?"%":" "+u);
const cutoff=()=>{const d=new Date();d.setFullYear(d.getFullYear()-range);return d.toISOString().slice(0,10)};
const MAMODE={usdkrw:"d",jpykrw:"d",usdjpy:"d",nfp:"m3",unemp:"m3",kr3y:"d",gold:"d",silver:"d",copper:"d",wti:"d",brent:"d",dubai:"m3",nickel:"m3",natgas:"d",usd_idx:"d",net_liq:"w"};
const PAL=["#4fc3cf","#e5a93d","#c58bf2","#e57a6f","#7bd88f"];
const MAS={d:[[50,"50일선","#e5a93d"],[200,"200일선","#c58bf2"]],m3:[[3,"3개월 평균","#e5a93d"]],w:[[4,"4주 평균","#e5a93d"],[13,"13주 평균","#c58bf2"]]};
let showMA=true;
function ma(p,n){const o=[];let s=0;for(let i=0;i<p.length;i++){s+=p[i][1];if(i>=n)s-=p[i-n][1];if(i>=n-1)o.push([p[i][0],s/n])}return o}
const maOf=keys=>showMA&&keys.length===1?MAS[MAMODE[keys[0]]]:null;
function draw(cv,keys,type){
  const co=cutoff(),labs=new Set(),ds=[];
  keys.forEach((k,i)=>{const x=D.series[k];if(!x)return;
    const m=new Map(x.points.filter(p=>p[0]>=co));m.forEach((_,d)=>labs.add(d));
    ds.push({label:x.name,m,color:PAL[i]||"#4fc3cf",w:1.8});
    (maOf(keys)||[]).forEach(([n,nm,c])=>ds.push({label:nm,m:new Map(ma(x.points,n).filter(p=>p[0]>=co)),color:c,w:1.3,line:1}))});
  const L=[...labs].sort();
  charts.push(new Chart(cv,{type:type||"line",
    data:{labels:L,datasets:ds.map(d=>({...(d.line?{type:"line"}:{}),label:d.label,data:L.map(l=>d.m.has(l)?d.m.get(l):null),
      borderColor:d.color,backgroundColor:d.color,borderWidth:d.w,pointRadius:0,spanGaps:true}))},
    options:{maintainAspectRatio:false,animation:false,interaction:{mode:"index",intersect:false},
      plugins:{legend:{display:false}},
      scales:{x:{grid:{display:false},ticks:{maxTicksLimit:6,color:css("--mute")}},
              y:{grid:{color:css("--line")},ticks:{color:css("--mute")}}}}}));
}
const paint=(el,blocks)=>el.querySelectorAll("canvas").forEach(cv=>{const b=blocks[+cv.dataset.i];draw(cv,b[1],b[2])});
const LAB=[["d","정의"],["w","발표 시기"],["n","핵심 포인트"],["s","투자 활용"],["c","주의할 점"]];
function mk(id,secs,opened){
  const root=document.getElementById(id);root.innerHTML="";
  secs.forEach(([sec,head,blocks],si)=>{
    const d=document.createElement("details");d.className="sec";d.open=opened.has(si);
    const sm=head.map(k=>{const x=D.series[k];if(!x)return"";const l=x.points[x.points.length-1];
      return`<span>${x.name}<b>${fmt(l[1],x.unit)}</b></span>`}).join("");
    d.innerHTML=`<summary><span class="st">${sec}</span><span class="sm">${sm||"<span>설명 전용</span>"}</span><span class="arr"></span></summary><div class="body">`
      +blocks.map(([title,keys,,info],bi)=>`<div class="blk"><h3>${title}</h3>${info.l?`<div class="links">${info.l.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t} ↗</a>`).join("")}</div>`:""}`
      +(keys.length?`<div class="chips">`+keys.map((k,i)=>{const x=D.series[k];if(!x)return`<span class="chip err">${k}: 수집 실패</span>`;
          const l=x.points[x.points.length-1];
          return`<span class="chip c${i}"><i></i>${x.name} <b>${fmt(l[1],x.unit)}</b> ${l[0]}</span>`}).join("")
        +(maOf(keys)||[]).map(([n,nm,c])=>`<span class="chip"><i style="background:${c}"></i>${nm}</span>`).join("")
        +`</div><div class="cv"><canvas data-i="${bi}"></canvas></div>`:"")
      +`<details class="info"><summary>ⓘ 지표 설명 보기</summary><div class="exp">`
      +LAB.map(([k,t])=>info[k]?`<p><strong>${t}</strong> ${info[k]}</p>`:"").join("")+`</div></details></div>`).join("")
      +`</div>`;
    d.addEventListener("toggle",e=>{if(e.target!==d)return;
      if(d.open){opened.add(si);paint(d,blocks)}else opened.delete(si)});
    root.appendChild(d);
    if(d.open)paint(d,blocks);
  });
}
const opened2=new Set(),opened3=new Set();
let EXD=null;
const tone=v=>v>0.25?["매파","h"]:v<-0.25?["비둘기","d"]:["중립",""];
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function build(){charts.splice(0).forEach(c=>c.destroy());mk("root",SECTIONS,opened);mk("croot2",SECTIONS2,opened2);mk("froot",SECTIONS3,opened3)}
document.getElementById("seg").addEventListener("click",e=>{
  const r=e.target.dataset.r;if(!r)return;range=+r;
  document.querySelectorAll("#seg button").forEach(x=>x.setAttribute("aria-pressed",x===e.target));
  build();
});
document.getElementById("mab").addEventListener("click",e=>{showMA=!showMA;e.target.setAttribute("aria-pressed",showMA);build()});
const jf=u=>fetch(u+"?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()});
let SIG="";
function load(){return Promise.all([jf("data.json"),jf("market.json").catch(()=>null),jf("extra.json").catch(()=>null)]).then(([d,m,x])=>{
  D=d;D.series=Object.assign({},d.series,m?m.series:{},x?x.series:{});EXD=x;SIG=d.updated+"|"+(m?m.updated:"");
  document.getElementById("upd").textContent="마지막 갱신 "+d.updated+" (한국시간)";
  const t=m?"마지막 갱신 "+m.updated+" (한국시간)":"아직 데이터가 없습니다.";
  ["upd2","upd3"].forEach(k=>document.getElementById(k).textContent=t);
  build();
}).catch(()=>{document.getElementById("upd").textContent="데이터를 불러오지 못했습니다."})}
load();
</script>
<!-- 증시 테이블 및 캔들 차트(TradingView Lightweight Charts) 연동 스크립트 -->
<script>(()=>{
function stockTab(C){
const $=id=>document.getElementById(id);let U;const chartsMap={};
const sg=(v,d=2)=>v==null?"-":(v>0?"+":"")+v.toFixed(d)+"%",cl=v=>v==null?"":v>=0?"up":"dn",px=v=>v==null?"-":v.toLocaleString("en-US",{minimumFractionDigits:C.dec,maximumFractionDigits:C.dec});

function renderCandle(container, rawData){
  container.innerHTML = "";
  if(!rawData || !rawData.length) { container.innerHTML = "<p class='sub'>차트 데이터가 없습니다.</p>"; return; }
  
  const chart = LightweightCharts.createChart(container, {
    layout: { background: { type: 'solid', color: '#111a24' }, textColor: '#8497a8' },
    grid: { vertLines: { color: '#1e2c3a' }, horzLines: { color: '#1e2c3a' } },
    timeScale: { borderColor: '#1e2c3a' },
    rightPriceScale: { borderColor: '#1e2c3a' }
  });
  
  const candleSeries = chart.addCandlestickSeries({
    upColor: '#2ea06e', downColor: '#e0584c',
    borderUpColor: '#2ea06e', borderDownColor: '#e0584c',
    wickUpColor: '#2ea06e', wickDownColor: '#e0584c',
  });
  
  // 데이터 포맷 정제 (객체 형태 또는 단순 숫자 배열 대응)
  const formatted = rawData.map(item => {
    if(typeof item === 'object' && item !== null && item.open !== undefined) {
      return { time: item.time, open: item.open, high: item.high, low: item.low, close: item.close };
    } else {
      // 구형 포맷(단순 종가만 있는 경우)을 가짜 OHLC로 변환
      let val = Array.isArray(item) ? item[1] : item;
      let timeStr = Array.isArray(item) ? item[0] : "";
      return { time: timeStr, open: val, high: val, low: val, close: val };
    }
  }).filter(x => x.time);

  candleSeries.setData(formatted);
  chart.timeScale().fitContent();
  return chart;
}

const row=(x,e)=>`<tr class="srow" data-t="${x.t}"><td class="l">${C.lab(x,e)}</td><td>${px(x.close)}</td><td class="${cl(x.chg)}">${sg(x.chg)}</td><td class="${cl(x.r5)}">${sg(x.r5,1)}</td><td class="${cl(x.r1m)}">${sg(x.r1m,1)}</td><td class="${cl(x.r3m)}">${sg(x.r3m,1)}</td></tr><tr class="crow" hidden><td colspan="6"><div class="cv"></div></td></tr>`;

function show(open){
  Object.values(chartsMap).forEach(c => { if(c && typeof c.remove === 'function') c.remove(); });
  Object.keys(chartsMap).forEach(k => delete chartsMap[k]);

  const S=[...U.sectors].sort((a,b)=>(b.etf_row.chg??-99)-(a.etf_row.chg??-99));
  $(C.root).innerHTML=S.map(s=>`<details class="sec" data-e="${s.etf}" ${open.has(s.etf)?"open":""}><summary><span class="st">${s.name}</span><span class="sm"><span>${s.etf}<b>${px(s.etf_row.close)}</b></span><span class="${cl(s.etf_row.chg)}"><b>${sg(s.etf_row.chg)}</b></span></span><span class="arr"></span></summary><div class="body"><div class="wrap"><table class="us"><tr><th></th><th>종가(${C.cur})</th><th>전일</th><th>5일</th><th>1개월</th><th>3개월</th></tr>${row(s.etf_row,1)}${s.stocks.map(x=>row(x)).join("")}</table></div><p class="sub">${C.sub}</p></div></details>`).join("");
  $(C.note).textContent=C.nt(U);
}

function openSet(){return new Set([...document.querySelectorAll("#"+C.root+" details[open]")].map(d=>d.dataset.e))}

$(C.root).addEventListener("click",e=>{
  const r=e.target.closest(".srow");if(!r)return;const c=r.nextElementSibling,t=r.dataset.t;
  if(c.hidden){
    c.hidden=false;
    const div=c.querySelector(".cv");
    if(U.px && U.px[t]){ chartsMap[t] = renderCandle(div, U.px[t]); }
  } else {
    c.hidden=true;
    if(chartsMap[t]){ chartsMap[t].remove(); delete chartsMap[t]; }
  }
});

window[C.loader]=()=>fetch(C.json+"?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{U=d;$(C.upd).textContent="마지막 갱신 "+d.updated+" (한국시간)";show(openSet())}).catch(()=>{$(C.upd).textContent="데이터가 없습니다."});
window[C.loader]();
}
