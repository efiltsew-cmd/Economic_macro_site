name: kr-update
on:
  schedule:
    - cron: "0 10 * * 1-5"   # 한국시간 평일 19:00 (장마감 후 수급 확정 뒤)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python fetch_kr.py
      - run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add krflow.json krtheme.json
          git diff --cached --quiet || (git commit -m "update kr" && git pull --rebase && git push)
