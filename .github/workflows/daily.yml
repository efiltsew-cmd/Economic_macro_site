name: daily-update
on:
  schedule:
    - cron: "30 20 * * *"   # 한국시간 05:30 (실행 지연을 감안해 6시 전에 완료)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
      - run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "update data" && git push)
