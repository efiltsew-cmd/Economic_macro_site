name: us-update
on:
  schedule:
    - cron: "0 22 * * 1-5"   # 한국시간 화~토 07:00 (미국 평일 장마감 후)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python fetch_us.py
      - run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add us.json
          git diff --cached --quiet || (git commit -m "update us" && git pull --rebase && git push)
