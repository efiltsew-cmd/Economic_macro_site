name: calendar-update
on:
  schedule:
    - cron: "45 20 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_calendar.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add calendar.json
          git diff --cached --quiet || (git commit -m "update calendar" && git pull --rebase && git push)
